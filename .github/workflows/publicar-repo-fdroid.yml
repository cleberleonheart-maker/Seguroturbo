name: Publicar repo F-Droid

# Publica a release nova no repositório F-Droid próprio (GitHub Pages) de forma
# automática, logo após o workflow "Release" terminar com sucesso. Também pode
# ser disparado manualmente informando a tag.
#
# Secrets necessários (no repositório do app):
#   FDROID_REPO_KEYSTORE_BASE64  — keystore.jks do repositório F-Droid (base64)
#   FDROID_REPO_KEYSTORE_PASS    — senha do keystore do repositório
#   FDROID_PAGES_TOKEN           — PAT (escopo repo) com push em
#                                  cleberleonheart-maker/seguraturbo-fdroid
#
# Veja docs/F-DROID.md (Caminho 2).

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release (ex.: v1.31). Vazio = última release.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: fdroid-repo
  cancel-in-progress: false

env:
  GITHUB_REPO: cleberleonheart-maker/Seguroturbo
  PAGES_REPO: cleberleonheart-maker/seguraturbo-fdroid
  PACOTE: com.seguraturbo.app

jobs:
  publicar:
    # No workflow_run, só prossegue se a release deu certo.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout do app
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Configurar Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar fdroidserver
        # Versão fixa: uma atualização do fdroidserver/androguard já quebrou a
        # leitura dos APKs do Galinha ("ResParserError: res1 must be zero!").
        # Só suba a versão depois de testar uma publicação de verdade.
        run: pip install "fdroidserver==2.4.5"

      - name: Descobrir a tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            TAG="$(gh release view --repo "$GITHUB_REPO" --json tagName -q .tagName)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publicando a tag: $TAG"

      - name: Baixar o APK da release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          APK_URL="$(gh release view "$TAG" --repo "$GITHUB_REPO" --json assets \
            -q ".assets[] | select(.name | test(\"${PACOTE}|SeguroTurbo-.*[^-debug].apk$\")) | select(.name | test(\"debug\") | not) | .url" \
            | head -n1)"
          [ -n "$APK_URL" ] || { echo "Nenhum APK na release $TAG" >&2; exit 1; }
          gh release download "$TAG" --repo "$GITHUB_REPO" --clobber \
            -p "$(basename "${APK_URL##*/}")" -O app-release.apk

      - name: Determinar versionCode
        id: ver
        run: |
          set -euo pipefail
          VCODE="$(sed -n 's/.*versionCode[^0-9]\+\([0-9]\+\).*/\1/p' app/build.gradle | head -n1)"
          VNAME="$(sed -n 's/.*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle | head -n1)"
          [ -n "$VCODE" ] || { echo "versionCode não encontrado" >&2; exit 1; }
          [ -n "$VNAME" ] || { echo "versionName não encontrado" >&2; exit 1; }

          MET="fdroid/${PACOTE}.yml"
          MET_VC="$(sed -n 's/^CurrentVersionCode:[[:space:]]*//p' "$MET" | tr -d '[:space:]')"
          MET_VN="$(sed -n 's/^CurrentVersion:[[:space:]]*//p' "$MET" | tr -d '[:space:]')"
          if [ "$MET_VC" != "$VCODE" ] || [ "$MET_VN" != "$VNAME" ]; then
            echo "erro: $MET está em $MET_VN ($MET_VC), mas app/build.gradle diz $VNAME ($VCODE)." >&2
            echo "      atualize CurrentVersion/CurrentVersionCode no metadata antes de publicar." >&2
            exit 1
          fi

          echo "vcode=$VCODE" >> "$GITHUB_OUTPUT"
          echo "versionCode: $VCODE ($VNAME) — metadata em sincronia"

      - name: Ler a versão do Galinha Assada
        id: galinha
        # A versão fica em version.properties (versionado) em vez de ser
        # derivada do relógio: publicar duas vezes o mesmo código gera o mesmo
        # APK, e o metadata em fdroid/ para de divergir do repo publicado.
        # Esta etapa também é a trava anti-divergência: se o metadata não
        # estiver na mesma versão, a publicação para aqui.
        run: |
          set -euo pipefail
          ARQ="galinha-assada/android/version.properties"
          MET="fdroid/br.com.galinhaassada.yml"
          [ -f "$ARQ" ] || { echo "$ARQ não encontrado" >&2; exit 1; }
          VC="$(sed -n 's/^versionCode=//p' "$ARQ" | tr -d '[:space:]')"
          VN="$(sed -n 's/^versionName=//p' "$ARQ" | tr -d '[:space:]')"
          [ -n "$VC" ] && [ -n "$VN" ] || { echo "versionCode/versionName ausentes em $ARQ" >&2; exit 1; }

          MET_VC="$(sed -n 's/^CurrentVersionCode:[[:space:]]*//p' "$MET" | tr -d '[:space:]')"
          MET_VN="$(sed -n 's/^CurrentVersion:[[:space:]]*//p' "$MET" | tr -d '[:space:]')"
          if [ "$MET_VC" != "$VC" ] || [ "$MET_VN" != "$VN" ]; then
            echo "erro: $MET está em $MET_VN ($MET_VC), mas $ARQ diz $VN ($VC)." >&2
            echo "      atualize CurrentVersion/CurrentVersionCode no metadata antes de publicar." >&2
            exit 1
          fi

          echo "vc=$VC" >> "$GITHUB_OUTPUT"
          echo "vn=$VN" >> "$GITHUB_OUTPUT"
          echo "VC_OVERRIDE=$VC" >> "$GITHUB_ENV"
          echo "VN_OVERRIDE=$VN" >> "$GITHUB_ENV"
          echo "Galinha Assada: $VN ($VC) — metadata em sincronia"

      - name: Montar o APK do Galinha Assada
        env:
          FDROID_GALINHA_KEYSTORE_BASE64: ${{ secrets.FDROID_GALINHA_KEYSTORE_BASE64 }}
          FDROID_GALINHA_KEYSTORE_PASS: ${{ secrets.FDROID_GALINHA_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          if [ -z "${FDROID_GALINHA_KEYSTORE_BASE64:-}" ]; then
            echo "::warning::secret FDROID_GALINHA_KEYSTORE_BASE64 ausente; Galinha Assada nao sera publicado"
            exit 0
          fi
          echo "$FDROID_GALINHA_KEYSTORE_BASE64" | base64 -d > galinha-assada/android/galinha.keystore
          KS_PASS="$FDROID_GALINHA_KEYSTORE_PASS" ./galinha-assada/android/build.sh

      - name: Baixar apps parceiros (Pulsa e Bússola)
        # Os APKs vêm das releases dos próprios apps (campo Binaries no
        # metadata). O script confere pacote, versão e assinatura contra o
        # metadata: se alguém republicar um APK com outra chave, para aqui.
        run: ./scripts/baixar-parceiros.sh "$RUNNER_TEMP/parceiros"

      - name: Montar o repositório F-Droid
        env:
          FDROID_REPO_KEYSTORE_BASE64: ${{ secrets.FDROID_REPO_KEYSTORE_BASE64 }}
          FDROID_REPO_KEYSTORE_PASS: ${{ secrets.FDROID_REPO_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          REPO_DIR="$RUNNER_TEMP/fdroid-repo"
          mkdir -p "$REPO_DIR/repo" "$REPO_DIR/metadata"
          echo "$FDROID_REPO_KEYSTORE_BASE64" | base64 -d > "$REPO_DIR/keystore.jks"
          cp fdroid/repo-config.example.yml "$REPO_DIR/config.yml"
          # lista de categorias válidas, só para o `fdroid lint` abaixo
          mkdir -p "$REPO_DIR/config"
          cp fdroid/categories.yml "$REPO_DIR/config/categories.yml"
          sed -i -e "s|^keystorepass:.*|keystorepass: ${FDROID_REPO_KEYSTORE_PASS}|" \
                 -e "s|^keypass:.*|keypass: ${FDROID_REPO_KEYSTORE_PASS}|" \
                 "$REPO_DIR/config.yml"
          cp fastlane/metadata/android/pt-BR/images/icon.png "$REPO_DIR/icon.png"
          cp fdroid/${PACOTE}.yml "$REPO_DIR/metadata/${PACOTE}.yml"
          cp app-release.apk "$REPO_DIR/repo/${PACOTE}_${{ steps.ver.outputs.vcode }}.apk"

          # apps parceiros (APKs baixados das releases na etapa anterior)
          cp fdroid/com.pulsa.player.yml fdroid/com.bussola.app.yml "$REPO_DIR/metadata/"
          cp "$RUNNER_TEMP"/parceiros/*.apk "$REPO_DIR/repo/"
          echo "Apps parceiros: $(ls "$RUNNER_TEMP"/parceiros/*.apk | xargs -n1 basename | tr '\n' ' ')"

          # Galinha Assada (mesmo repositorio, app separado). A versão vem de
          # version.properties; aqui só confirmamos que o APK saiu com ela.
          if [ -f galinha-assada/apk/galinha-assada.apk ]; then
            BT="$(ls -d "${ANDROID_HOME:-$HOME/android-sdk}"/build-tools/*/ | sort -V | tail -1)"
            BADGING="$("$BT/aapt2" dump badging galinha-assada/apk/galinha-assada.apk)"
            GVC="$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" <<<"$BADGING" | head -n1)"
            GVN="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -n1)"
            [ -n "$GVC" ] || { echo "versionCode do Galinha Assada nao encontrado" >&2; exit 1; }
            if [ "$GVC" != "${{ steps.galinha.outputs.vc }}" ] || [ "$GVN" != "${{ steps.galinha.outputs.vn }}" ]; then
              echo "erro: o APK saiu como $GVN ($GVC), esperado ${{ steps.galinha.outputs.vn }} (${{ steps.galinha.outputs.vc }})" >&2
              exit 1
            fi
            cp fdroid/br.com.galinhaassada.yml "$REPO_DIR/metadata/br.com.galinhaassada.yml"
            cp galinha-assada/apk/galinha-assada.apk "$REPO_DIR/repo/br.com.galinhaassada_${GVC}.apk"
            echo "Galinha Assada $GVN ($GVC)"
          fi

          # ícones dos apps (layout do fdroidserver: metadata/<pacote>/<locale>/images/icon.png)
          if [ -d fdroid/metadata ]; then
            cp -r fdroid/metadata/. "$REPO_DIR/metadata/"
          fi

          # confere o metadata antes de gerar o índice. Pega categoria inválida,
          # Summary faltando, link com /main em vez de /HEAD, descrição com
          # espaço sobrando etc. Qualquer aviso interrompe a publicação.
          ( cd "$REPO_DIR" && fdroid lint )

          cd "$REPO_DIR"
          export FDROID_KEY_STORE_PASS="$FDROID_REPO_KEYSTORE_PASS"
          export FDROID_KEY_PASS="$FDROID_REPO_KEYSTORE_PASS"
          fdroid update --create-metadata
          fdroid update -c

      - name: Publicar no GitHub Pages
        env:
          PAGES_TOKEN: ${{ secrets.FDROID_PAGES_TOKEN }}
        run: |
          set -euo pipefail
          REPO_DIR="$RUNNER_TEMP/fdroid-repo"
          APK_NAME="${PACOTE}_${{ steps.ver.outputs.vcode }}.apk"
          git clone "https://x-access-token:${PAGES_TOKEN}@github.com/${PAGES_REPO}.git" pages
          # publica o mesmo repo em tres caminhos, para que qualquer URL que o
          # app F-Droid tente funcionar (raiz, /fdroid/repo e o /repo antigo)
          # '--filter=protect *.apk' mantem as versoes antigas no ar (os links
          # ja enviados continuam baixando) sem impedir a copia da versao nova
          rsync -a --delete --filter='protect *.apk' \
                --exclude='/fdroid' --exclude='/repo' \
                --exclude='/.nojekyll' --exclude='/README.md' --exclude='/.git' \
                "$REPO_DIR/repo/" pages/
          rsync -a --delete --filter='protect *.apk' "$REPO_DIR/repo/" pages/fdroid/repo/
          rsync -a --delete --filter='protect *.apk' "$REPO_DIR/repo/" pages/repo/
          # pagina de boas-vindas (troca o index.html gerado pelo fdroidserver)
          python3 fdroid/gerar-welcome.py "$REPO_DIR/repo" pages/index.html ""
          python3 fdroid/gerar-welcome.py "$REPO_DIR/repo" pages/fdroid/repo/index.html "/fdroid/repo"
          python3 fdroid/gerar-welcome.py "$REPO_DIR/repo" pages/repo/index.html "/repo"
          # página de changelog
          python3 fdroid/gerar-changelog.py fastlane/metadata/android pages/changelog.html ""
          python3 fdroid/gerar-changelog.py fastlane/metadata/android pages/fdroid/repo/changelog.html "/fdroid/repo"
          python3 fdroid/gerar-changelog.py fastlane/metadata/android pages/repo/changelog.html "/repo"
          # retenção: mantém só as 5 versões mais novas de cada app em cada
          # caminho (o Pages acumulava uma cópia de toda versão já publicada).
          # nunca remove APK referenciado no índice daquele caminho.
          python3 fdroid/limpar-pages.py pages 5
          # o jogo em si (index.html): o app Android usa esse arquivo para
          # atualizar o jogo direto, sem baixar nem instalar APK
          mkdir -p pages/galinha
          cp galinha-assada/index.html pages/galinha/index.html
          cd pages
          git add -A
          if git diff --cached --quiet; then
            echo "Nada mudou no repositório F-Droid."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "repo: publica $APK_NAME (${{ steps.tag.outputs.tag }})"
          git push -q origin HEAD:main
          echo "Publicado: $APK_NAME"
