name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # O gradle.properties fixa pouca memória (máquina local pequena); no CI há mais.
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Permissão do wrapper
        run: chmod +x ./gradlew

      - name: Testes unitários
        run: ./gradlew test --no-daemon

      - name: Cobertura de testes (JaCoCo)
        run: ./gradlew jacocoTestReport --no-daemon

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-testes
          path: app/build/reports/jacoco/jacocoTestReport

      - name: Análise estática (lint)
        run: ./gradlew lintDebug --no-daemon

      - name: Build debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Compilar testes instrumentados
        run: ./gradlew assembleDebugAndroidTest --no-daemon
