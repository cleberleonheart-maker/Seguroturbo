function drawScene(){
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, W, H);
  const bg = ctx.createRadialGradient(W / 2, H / 2, 40, W / 2, H / 2, W * 0.75);
  bg.addColorStop(0, "rgba(123,47,247,.16)");
  bg.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  if (state === "title"){ drawAttract(); return; }

  renderMaze();

  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++)
    if (food.grid[r][c]) drawPellet(c * T + T / 2, r * T + T / 2);

  if (pepper) for (const p of pepper) if (p) drawPepper(p.c * T + T / 2, p.r * T + T / 2);
  if (fruit) drawFruit(fruit.c * T + T / 2, fruit.r * T + T / 2, fruit.left, fruit.type && fruit.type.id);
  if (fish) drawFish(fish.c * T + T / 2, fish.r * T + T / 2);
  if (powerup) drawPowerup(powerup.c * T + T / 2, powerup.r * T + T / 2, powerup.kind);

  if (state !== "clear"){
    for (const g of ghosts) if (g.active){
      const gp = entPos(g);
      if (g.clone) drawClone(gp.x, gp.y, ANG[g.dir], g.boss ? 17 : 15, g);
      else drawGhost(gp.x, gp.y, g, g.boss ? 19 : 14);
    }
  }

  if (state === "dying"){
    const k = Math.min(1, (1.8 - stateTimer) / 1.2);
    const p = entPos(player);
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(k * 9);
    ctx.globalAlpha = 1 - k * 0.55;
    drawChickenBody(ctx, 0, Math.max(2, 14 * (1 - k * 0.8)), 0);
    ctx.restore();
  } else {
    const p = entPos(player);
    drawChicken(p.x, p.y, ANG[player.dir], 14, {
      wobble: player.moving ? Math.sin(tGlobal * 16) : 0,
      aura: frightTimer > 0 || turbo > 0,
      fire: turbo > 0
    });
  }

  ctx.save();
  for (const tr of trail){
    ctx.globalAlpha = Math.max(0, 0.7 * (1 - tr.t / tr.life));
    ctx.fillStyle = "#67e8f9";
    ctx.beginPath(); ctx.arc(tr.x, tr.y, 7 * (1 - tr.t / tr.life), 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  ctx.save();
  for (const spk of sparks){
    ctx.globalAlpha = Math.max(0, 1 - spk.t / spk.life);
    ctx.fillStyle = "#fde68a";
    ctx.beginPath(); ctx.arc(spk.x, spk.y, 2.4 * (1 - spk.t / spk.life), 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  for (const f of feathers) drawFeather(f.x, f.y, f.rot, Math.max(0, 1 - f.t / 1.5));

  ctx.textAlign = "center";
  ctx.font = "bold 13px 'Trebuchet MS', sans-serif";
  for (const p of popups){
    ctx.save();
    ctx.globalAlpha = Math.max(0, 1 - p.t / 1.2);
    ctx.fillStyle = p.color;
    ctx.shadowColor = "rgba(0,0,0,.85)"; ctx.shadowBlur = 6;
    ctx.fillText(p.text, p.c * T + T / 2, p.r * T + T / 2 - 10 - p.t * 22);
    ctx.restore();
  }

  if (frightTimer > 0){
    const w = 130 * Math.min(1, frightTimer / 2.5);
    ctx.fillStyle = "rgba(0,0,0,.45)";
    ctx.fillRect(W / 2 - 66, 10, 132, 8);
    ctx.fillStyle = "#f97316";
    ctx.fillRect(W / 2 - w / 2, 10, w, 8);
  }

  if (chainMult > 1){
    ctx.save();
    ctx.textAlign = "center";
    ctx.font = "bold 15px 'Trebuchet MS', sans-serif";
    ctx.fillStyle = "#fde68a";
    ctx.shadowColor = "rgba(250,204,21,.9)"; ctx.shadowBlur = 12;
    ctx.fillText("COMBO x" + chainMult, W / 2, 60);
    ctx.restore();
  }

  if (turbo > 0){
    const tw = 130 * Math.min(1, turbo / 2);
    ctx.fillStyle = "rgba(0,0,0,.45)";
    ctx.fillRect(W / 2 - 66, 22, 132, 8);
    ctx.fillStyle = "#22d3ee";
    ctx.fillRect(W / 2 - tw / 2, 22, tw, 8);
    ctx.save();
    ctx.textAlign = "center";
    ctx.font = "bold 10px 'Trebuchet MS', sans-serif";
    ctx.fillStyle = "#67e8f9";
    ctx.shadowColor = "rgba(34,211,238,.8)"; ctx.shadowBlur = 8;
    ctx.fillText("TURBO", W / 2, 44);
    ctx.restore();
  }

  if (hurry && state === "play"){
    ctx.save();
    ctx.textAlign = "center";
    ctx.font = "bold 14px 'Trebuchet MS', sans-serif";
    ctx.fillStyle = Math.floor(tGlobal * 6) % 2 ? "#fca5a5" : "#fde68a";
    ctx.fillText("DEPRESSA!", W / 2, 78);
    ctx.restore();
  }

  drawPowerHud();

  if (state === "ready"){
    const x = stateTimer - 0.2;
    const n = Math.min(3, Math.ceil(x));
    if (n > 0){
      const into = 1 - (x - Math.floor(x));       // 0 no comeco do segundo
      bigNum(String(n), n === 1 ? "#a3e635" : "#ffe9b8", 1 + into * 0.32);
    } else {
      banner("VAI, GALINHA!", "#a3e635");
    }
  }
  else if (state === "clear") banner(bonus ? "FESTA DA GALINHA!" : "FASE COMPLETA!", "#fde68a");
}

function shareScore(){
  const top = getScores();
  let rank = 0;
  if (score > 0){
    for (let i = 0; i < top.length; i++){ if (top[i].at === lastScoreAt){ rank = i + 1; break; } }
    if (!rank){
      const pos = top.filter(x => x.score > score).length + 1;
      if (pos <= 10) rank = pos;
    }
  }
  const text = `Galinha Assada! Pontos: ${fmt(score)} — Fase ${level} — Recorde: ${fmt(globalBest())}` +
    (rank ? ` — ${rank}º no ranking` : "") +
    ` — Conquistas: ${Object.keys(ACH_UNLOCKED).length}/${ACH.length}. Joga aí!`;
  try {
    if (navigator.share){
      navigator.share({ title: "Galinha Assada", text });
      return;
    }
    if (navigator.clipboard){
      navigator.clipboard.writeText(text);
      alert("Texto copiado para a área de transferência!");
      return;
    }
    const a = document.createElement("a");
    a.href = "https://wa.me/?text=" + encodeURIComponent(text);
    a.target = "_blank";
    a.click();
  } catch (e) {
    try { navigator.clipboard.writeText(text); } catch (x) {}
  }
}

/* ---- backup do progresso (export/import) ---- */
function persistBests(){
  for (const k of DIFF_KEYS) store.set(BEST_KEY + "_" + k, String(bestByDiff[k] || 0));
  store.set(BEST_KEY, String(globalBest()));
}
function exportSave(){
  const data = { v: 1, c: CFG, a: ACH_UNLOCKED, b: bestByDiff, g: PROG, s: streak, l: lastDay };
  const bytes = new TextEncoder().encode(JSON.stringify(data));
  let bin = "";
  for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin);
}
function importSave(code){
  let data;
  try {
    const bin = atob(String(code || "").trim());
    const bytes = Uint8Array.from(bin, (ch) => ch.charCodeAt(0));
    data = JSON.parse(new TextDecoder().decode(bytes));
  } catch (e) { toast("Código inválido ou corrompido", "#ef4444"); return false; }
  if (!data || typeof data !== "object") { toast("Código inválido", "#ef4444"); return false; }
  if (data.c) Object.assign(CFG, data.c);
  if (data.a) ACH_UNLOCKED = data.a;
  if (data.b) for (const k of DIFF_KEYS) if (typeof data.b[k] === "number") bestByDiff[k] = data.b[k];
  if (data.g) PROG = Object.assign({}, PROG_DEFAULT, data.g);
  if (typeof data.s === "number") streak = data.s;
  if (typeof data.l === "string") lastDay = data.l;
  persistBests(); saveCfg(); saveProg(); saveAch();
  best = bestByDiff[CFG.diff] || 0;
  applyCfg(); refreshAll();
  toast("Progresso importado!", "#a3e635");
  return true;
}
function copySave(){
  const el = document.getElementById("saveCode");
  if (!el) return;
  const text = el.value;
  const ok = () => toast("Código copiado!", "#a3e635");
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(ok, () => { el.select(); try { document.execCommand("copy"); ok(); } catch (x) { toast("Selecione e copie o código", "#f59e0b"); } });
      return;
    }
  } catch (e) {}
  el.select();
  try { document.execCommand("copy"); ok(); } catch (x) { toast("Selecione e copie o código", "#f59e0b"); }
}

/* ---- bolinha de controle no canto (joystick) ---- */
const stickEl = document.getElementById("stick");
const knobEl = document.getElementById("knob");
let stickId = null, stickDir = -1;

function stickAim(dx, dy){
  const max = Math.max(1, stickEl.clientWidth / 2 - knobEl.offsetWidth / 2 - 4);
  const dist = Math.hypot(dx, dy);
  if (dist > 0){
    const k = Math.min(1, dist / max);
    knobEl.style.transform = `translate(${dx / dist * max * k}px,${dy / dist * max * k}px)`;
  }
  if (dist < max * 0.12){ stickDir = -1; return; }          // zona morta
  const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0);
  if (dir === stickDir) return;
  stickDir = dir;
  Sound.init(); Sound.resume();
  if (state === "title" || state === "over") startGame();
  if (state !== "paused" && player) player.want = dir;      // solta -> segue no ultimo rumo
}

function stickRelease(){
  stickId = null; stickDir = -1;
  knobEl.style.transform = "translate(0px,0px)";
  stickEl.classList.remove("hit");
}

stickEl.addEventListener("pointerdown", (e) => {
  stickId = e.pointerId;
  try { stickEl.setPointerCapture(e.pointerId); } catch (_) {}
  stickEl.classList.add("hit");
  const r = stickEl.getBoundingClientRect();
  stickAim(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));
  e.preventDefault();
});
stickEl.addEventListener("pointermove", (e) => {
  if (e.pointerId !== stickId) return;
  const r = stickEl.getBoundingClientRect();
  stickAim(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));
  e.preventDefault();
});
["pointerup", "pointercancel"].forEach((ev) =>
  stickEl.addEventListener(ev, (e) => { if (e.pointerId === stickId) stickRelease(); })
);

function cfgLabel(key){
  if (key === "stick") return CFG.stick ? "SIM" : "NAO";
  if (key === "side") return CFG.side === "left" ? "ESQUERDA" : "DIREITA";
  if (key === "size") return { small: "PEQUENA", normal: "MEDIA", large: "GRANDE" }[CFG.size];
  if (key === "vol") return Math.round(CFG.vol * 100) + "%";
  if (key === "vibrate") return CFG.vibrate ? "SIM" : "NAO";
  if (key === "diff") return DIFF[CFG.diff].label;
  if (key === "reduceMotion") return CFG.reduceMotion ? "SIM" : "NAO";
  if (key === "contrast") return CFG.contrast ? "SIM" : "NAO";
  if (key === "bigText") return CFG.bigText ? "SIM" : "NAO";
  if (key === "nick") return (CFG.nick && String(CFG.nick).trim()) ? String(CFG.nick).trim().slice(0, 12) : "Player";
  if (key === "server") return (CFG.server && String(CFG.server).trim()) ? "custom" : "padrao";
  return "";
}
function cfgCycle(key){
  if (key === "stick") CFG.stick = !CFG.stick;
  else if (key === "side") CFG.side = CFG.side === "left" ? "right" : "left";
  else if (key === "size") CFG.size = { small: "normal", normal: "large", large: "small" }[CFG.size];
  else if (key === "vol") Sound.setVolume(CFG.vol >= 0.99 ? 0.2 : Math.min(1, CFG.vol + 0.2));
  else if (key === "vibrate") CFG.vibrate = !CFG.vibrate;
  else if (key === "diff") CFG.diff = { easy: "normal", normal: "hard", hard: "zen", zen: "easy" }[CFG.diff];
  else if (key === "reduceMotion") CFG.reduceMotion = !CFG.reduceMotion;
  else if (key === "contrast") CFG.contrast = !CFG.contrast;
  else if (key === "bigText") CFG.bigText = !CFG.bigText;
  else if (key === "nick"){
    const v = window.prompt("Apelido no ranking online:", CFG.nick || "Player");
    if (v !== null){ CFG.nick = (v.trim() || "Player").slice(0, 14); }
  }
  else if (key === "server"){
    const v = window.prompt("URL do servidor de placar online:", onlineServer());
    if (v !== null){ const s = v.trim(); CFG.server = s ? s.replace(/\/+$/, "") : null; }
  }
  else if (key === "music"){
    CFG.music = CFG.music === false ? true : false;
    Sound.musicOn = CFG.music;
    if (!CFG.music) Sound.stopMusic(); else Sound.startMusic(level);
  }
  saveCfg();
  applyCfg();
  best = bestByDiff[CFG.diff] || 0;
  refreshScore();
  if (player) player.baseSpeed = playerSpeed();
  if (state === "play") Sound.startSiren(level);
  renderSettings();
  if (key === "vibrate") Buzz.ok(30);
}

/* ---- controle fisico (gamepad) ---- */
const gpBadge = document.getElementById("gpbadge");
const gpWas = Object.create(null);
let gpDir = -1;
let gpInvertY = (function(){ try { return localStorage.getItem("galinha.gpinv") === "1"; } catch (e){ return false; } })();  // ajuste manual quando o Y vem invertido
let gpPanelOn = false;          // tela de diagnostico aberta
let gpBackPanel = "game";
let gpPanelAt = 0;
let gpCalStep = 0;              // 0 = ocioso | 1 = direita | 2 = cima
let gpCalBase = null, gpCalPick = -1, gpCalVal = 0, gpCalPeak = 0, gpCalReady = false;

/* calibracao do manche: em qual eixo esta o X, em qual o Y e o sentido de cada um.
   necessaria porque android/BT costuma reportar os eixos fora do padrao W3C. */
const GP_CAL_KEY = "galinha.gpcal";
let gpCal = null;
try { const c = JSON.parse(localStorage.getItem(GP_CAL_KEY) || "null"); if (c && c.xAxis != null && c.yAxis != null) gpCal = c; } catch (e) {}

/* sinal dos eixos do manche nativo (android): alguns controles vem com o Y invertido */
const GP_NAT_KEY = "galinha.gpnat";
let gpNatSigns = { x: 1, y: 1 };
try { const n = JSON.parse(localStorage.getItem(GP_NAT_KEY) || "null"); if (n && n.x && n.y) gpNatSigns = n; } catch (e) {}
function gpNatSave(){
  try { localStorage.setItem(GP_NAT_KEY, JSON.stringify(gpNatSigns)); } catch (e) {}
}

function gpDown(pad, i){
  const b = pad.buttons[i];
  return !!(b && (b.pressed || b.value > 0.5));
}
function gpClick(pad, i){
  if (!pad) return false;
  const key = pad.index + ":" + i, now = gpDown(pad, i), was = gpWas[key] === true;
  gpWas[key] = now;
  return now && !was;
}
// par (x,y) -> direcao do jogo (0=cima 1=direita 2=baixo 3=esquerda)
function gpDirXY(hx, vy, dz){
  if (Math.hypot(hx, vy) < dz) return -1;
  const ah = Math.abs(hx), av = Math.abs(vy);
  return (ah >= av) ? (hx > 0 ? 1 : 3) : (vy > 0 ? 2 : 0);
}
// D-pad padrao W3C: 12=cima 13=baixo 14=esquerda 15=direita
function gpDpad(pad){
  if (!pad) return -1;
  if (gpDown(pad, 12)) return 0;
  if (gpDown(pad, 15)) return 1;
  if (gpDown(pad, 13)) return 2;
  if (gpDown(pad, 14)) return 3;
  return -1;
}
// manche -> direcao (usa a calibracao; sem ela varre todos os pares de eixos)
function gpAxes(pad){
  if (!pad) return -1;
  const A = pad.axes || [];
  if (gpCal){
    const hx = (A[gpCal.xAxis] || 0) * gpCal.xSign * (gpCal.xGain || 1);
    const vy = (A[gpCal.yAxis] || 0) * gpCal.ySign * (gpCal.yGain || 1) * (gpInvertY ? -1 : 1);
    return gpDirXY(hx, vy, 0.22);
  }
  const dz = 0.15;                                   // zona morta radial
  let bestDir = -1;
  let bestMag = 0;
  for (let i = 0; i + 1 < A.length; i += 2){
    const hx = A[i] || 0;
    let vy = A[i+1] || 0;
    if (gpInvertY) vy = -vy;
    const mag = Math.hypot(hx, vy);
    if (mag < dz) continue;
    const dir = gpDirXY(hx, vy, 0);
    if (bestDir === -1 || mag > bestMag){
      bestMag = mag;
      bestDir = dir;
    }
  }
  return bestDir;
}
function gpDirOf(pad){
  const nd = gpNativeDir();               // ponte com o app Android (eixos nativos)
  if (nd >= 0) return nd;
  const d = gpDpad(pad);
  if (d >= 0) return d;
  return gpAxes(pad);
}

/* ---- ponte com o app Android: o WebView nao recebe os eixos do manche,
   entao o app Android le e manda pra ca ---- */
const gpNative = { x:0, y:0, hx:0, hy:0, keys:Object.create(null), on:false };
window.__gpAxis = (x, y, hx, hy) => {
  gpNative.on = true;
  gpNative.x = x; gpNative.y = y; gpNative.hx = hx; gpNative.hy = hy;
};
window.__gpBtn = (id, down) => {
  gpNative.on = true;
  if (down) gpNative.keys[id] = true; else delete gpNative.keys[id];
  if (!down) return;
  if (id === 4){
    if (state === "title" || state === "over") startGame();
    else if (state === "paused") resumeGame();
  }
  else if (id === 5){ Sound.toggle(); }
  else if (id === 6 || id === 7){ state === "paused" ? resumeGame() : pauseGame(); }
};
function gpNativeDir(){
  if (gpNative.keys[0]) return 0;
  if (gpNative.keys[1]) return 1;
  if (gpNative.keys[2]) return 2;
  if (gpNative.keys[3]) return 3;
  const sx = gpNatSigns.x || 1, sy = (gpNatSigns.y || 1) * (gpInvertY ? -1 : 1);
  const hx = gpNative.hx * sx, hy = gpNative.hy * sy;
  if (hx > 0.5) return 1;                 // hat: X+ = direita
  if (hx < -0.5) return 3;
  if (hy < -0.5) return 0;                 // hat: Y- = cima (padrao do Android)
  if (hy > 0.5) return 2;
  const x = gpNative.x * sx, y = gpNative.y * sy;
  if (Math.hypot(x, y) < 0.18) return -1;
  if (Math.abs(x) >= Math.abs(y)) return x > 0 ? 1 : 3;
  return y < 0 ? 0 : 2;                    // manche: Y- = cima (padrao do Android)
}
let padConnected = false;
let gpLastPad = null;
function pollGamepad(){
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  let pad = null;
  for (const p of pads){ if (p && p.connected){ pad = p; break; } }
  if (!pad && !gpNative.on){
    if (padConnected){ padConnected = false; gpBadge.classList.remove("on"); }
    gpDir = -1;
    if (gpPanelOn) gpPanelLive(null, -1);
    return;
  }
  if (!padConnected){ padConnected = true; gpBadge.classList.add("on"); }
  gpLastPad = pad;
  const d = gpDirOf(pad);
  const c0 = gpClick(pad, 0), c1 = gpClick(pad, 1), c2 = gpClick(pad, 2), c9 = gpClick(pad, 9), c8 = gpClick(pad, 8);
  if (gpPanelOn){
    gpDir = -1;                                   // painel aberto: nao mexe na galinha
  } else {
    if (d >= 0){ if (d !== gpDir) pressDir(d); gpDir = d; }
    else gpDir = -1;
    if (c9 || c8) state === "paused" ? resumeGame() : pauseGame();
    if (c0){
      if (state === "title" || state === "over") startGame();
      else if (state === "paused") resumeGame();
    }
    if (c1 || c2){ Sound.toggle(); }
  }
  if (gpCalStep) gpCalTick(pad);
  if (gpPanelOn) gpPanelLive(pad, d);
}

/* ---- calibracao do manche ----
   canais = eixos que o jogo pode ler: os nativos do android (x, y) ou os do
   navegador (indices). o passos 1 (direita) e 2 (cima) Teach o sinal de cada um. */
function gpCalChannels(pad){
  if (gpNative.on) return [{ k:"x", v:gpNative.x }, { k:"y", v:gpNative.y }];
  const A = (pad && pad.axes) || [];
  return A.map((v, i) => ({ k:i, v:v || 0 }));
}
function gpCalStart(){
  gpCalStep = 1;
  gpCalBase = null; gpCalPick = -1; gpCalVal = 0; gpCalPeak = 0; gpCalReady = false;
  gpPanelAt = 0;
}
function gpCalTick(pad){
  const ch = gpCalChannels(pad);
  if (!ch.length) return;
  const cur = ch.map(c => c.v);
  if (gpCalPick < 0){
    let maxAbs = 0;
    for (const v of cur) if (Math.abs(v) > maxAbs) maxAbs = Math.abs(v);
    if (maxAbs < 0.15){                             // manche no centro: guarda o repouso
      gpCalBase = cur.slice();
      gpCalReady = true;
      return;
    }
    if (!gpCalReady) return;                       // so detecta depois de ver o centro
    let bi = -1, bv = 0;
    for (let i = 0; i < cur.length; i++){
      const d = cur[i] - gpCalBase[i];
      if (Math.abs(d) > Math.abs(bv)){ bi = i; bv = d; }
    }
    if (Math.abs(bv) > 0.12){ gpCalPick = bi; gpCalVal = bv; gpCalPeak = Math.abs(bv); }
    return;
  }
  const d = cur[gpCalPick] - gpCalBase[gpCalPick];
  if (Math.abs(d) > gpCalPeak) gpCalPeak = Math.abs(d);
}
function gpCalConfirm(){
  if (gpCalPick < 0) return;                         // nenhum eixo se moveu ainda
  const gain = 1 / Math.max(gpCalPeak, 0.5);
  const ch = gpCalChannels(gpLastPad);
  const key = gpCalPick < ch.length ? ch[gpCalPick].k : gpCalPick;
  const sign = gpCalVal > 0 ? 1 : -1;                // sinal do movimento detectado
  if (gpNative.on){
    // android: canal x = horizontal, canal y = vertical (positivo = cima depois do sinal)
    if (key === "x") gpNatSigns.x = sign;        // direita -> X positivo
    else if (key === "y") gpNatSigns.y = -sign;   // cima -> Y negativo
    gpNatSave();
    if (gpCalStep === 2){
      gpCalStep = 0;
      toast("Manche calibrado!", "#a3e635");
    } else {
      gpCalStep = 2;
    }
  } else {
    gpCal = gpCal || {};
    if (gpCalStep === 1){
      gpCal.xAxis = key;
      gpCal.xSign = sign;                            // para a direita o X do jogo deve dar positivo
      gpCal.xGain = gain;
      gpCalStep = 2;
    } else {
      gpCal.yAxis = key;
      gpCal.ySign = sign > 0 ? -1 : 1;               // para cima o Y do jogo deve dar negativo
      gpCal.yGain = gain;
      gpCalStep = 0;
      try { localStorage.setItem(GP_CAL_KEY, JSON.stringify(gpCal)); } catch (e) {}
      toast("Manche calibrado!", "#a3e635");
    }
  }
  gpCalBase = null; gpCalPick = -1; gpCalVal = 0; gpCalPeak = 0; gpCalReady = false;
  gpPanelAt = 0;
}
function gpCalClear(){
  gpCal = null;
  gpNatSigns = { x: 1, y: 1 };
  gpCalStep = 0;
  try { localStorage.removeItem(GP_CAL_KEY); } catch (e) {}
  try { localStorage.removeItem(GP_NAT_KEY); } catch (e) {}
  gpPanelAt = 0;
}

// monta a tela (so quando o estado muda, para o toque nos botoes nao se perder)
function gpPanelRender(){

      <h1>CALIBRANDO<em>passo ${gpCalStep} de 2</em></h1>
      <div class="sub">${gpCalStep === 1
        ? "Com o manche no <b>centro</b>, mova para a <b>DIREITA</b> e segure."
        : "Com o manche no <b>centro</b>, mova para <b>CIMA</b> e segure."}</div>
      <div style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;max-width:340px;margin:12px auto;line-height:1.7;text-align:left">
        canal detectado: <b id="gpx_pick">nenhum</b><br>
        valor: <b id="gpx_val">0.00</b>
      </div>
      <div class="row">
        <button class="btn" data-act="gpcalok">CONFIRMAR</button>
        <button class="iconbtn" data-act="gpcancel">CANCELAR</button>
      </div>`;
  } else {
    ui.panel.innerHTML = `
      <h1>CONTROLE<em>diagnóstico e calibração</em></h1>
      <div class="sub" style="word-break:break-all" id="gpx_nome">controle</div>
      <div style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;max-width:340px;margin:12px auto;line-height:1.7;text-align:left">
        eixos: <b id="gpx_axes">nenhum</b><br>
        nativo: <b id="gpx_nat">${gpNative.on ? `x:${gpNative.x.toFixed(2)} y:${gpNative.y.toFixed(2)} hat:${gpNative.hx.toFixed(1)},${gpNative.hy.toFixed(1)} • sinal x:${gpNatSigns.x > 0 ? "+" : "−"} y:${gpNatSigns.y > 0 ? "+" : "−"}` : "inativo"}</b><br>
        botões: <b id="gpx_btns">nenhum</b><br>
        direção lida: <b id="gpx_dir">—</b><br>
        calibração: <b id="gpx_cal">${gpCal
          ? `X no eixo ${gpCal.xAxis} (${gpCal.xSign > 0 ? "+" : "−"}) • Y no eixo ${gpCal.yAxis} (${gpCal.ySign > 0 ? "+" : "−"})`
          : "não feita (padrão X=0, Y=1)"}${gpNative.on
          ? ` • nativo x:${gpNatSigns.x > 0 ? "+" : "−"} y:${gpNatSigns.y > 0 ? "+" : "−"}` : ""}</b>
      </div>
      <div class="row">
        <button class="btn" data-act="gpcal">CALIBRAR MANCHE</button>
        <button class="iconbtn" data-act="gpinv" id="gpx_inv">Y INVERTIDO: ${gpInvertY ? "SIM" : "NÃO"}</button>
        ${(gpCal || gpNatSigns.x !== 1 || gpNatSigns.y !== 1) ? '<button class="iconbtn" data-act="gpcalclear">ZERAR CALIBRAÇÃO</button>' : ""}
        <button class="iconbtn" data-act="gpback">VOLTAR</button>
      </div>`;
  }
  ui.overlay.classList.remove("hidden");
}
// atualiza so os valores ao vivo (sem remontar a tela)
function gpPanelLive(pad, dir){
  const now = performance.now();
  if (now - gpPanelAt < 100) return;
  gpPanelAt = now;
  const A = pad ? (pad.axes || []) : [];
  let ax = "";
  for (let i = 0; i < A.length; i++) ax += (i ? "  " : "") + i + ":" + (A[i] >= 0 ? "+" : "") + A[i].toFixed(2);
  const bs = [];
  if (pad) for (let i = 0; i < pad.buttons.length; i++) if (gpDown(pad, i)) bs.push(i);
  const set = (id, txt) => { const el = document.getElementById(id); if (el && el.textContent !== txt) el.textContent = txt; };
  set("gpx_nome", pad ? (pad.id || "controle").slice(0, 34) : "nenhum controle conectado");
  set("gpx_axes", ax || "nenhum");
  set("gpx_nat", gpNative.on
    ? `x:${gpNative.x.toFixed(2)} y:${gpNative.y.toFixed(2)} hat:${gpNative.hx.toFixed(1)},${gpNative.hy.toFixed(1)} • sinal x:${gpNatSigns.x > 0 ? "+" : "−"} y:${gpNatSigns.y > 0 ? "+" : "−"}`
    : "inativo");
  set("gpx_btns", bs.length ? bs.join(", ") : "nenhum");
  set("gpx_dir", dir < 0 ? "—" : ["▲ CIMA", "▶ DIREITA", "▼ BAIXO", "◀ ESQUERDA"][dir]);
  const pick = gpCalPick < 0 ? "nenhum"
    : (gpNative.on ? ["X", "Y"][gpCalPick] || String(gpCalPick) : String(gpCalPick));
  set("gpx_pick", pick);
  set("gpx_val", (gpCalVal >= 0 ? "+" : "") + gpCalVal.toFixed(2));
}
document.getElementById("gpdbgbtn").addEventListener("click", () => openGamepad("game"));

let touch = null;
cv.addEventListener("touchstart", (e) => {
  const t = e.changedTouches[0];
  touch = { x: t.clientX, y: t.clientY };
  Sound.init(); Sound.resume();
  if (state === "title" || state === "over") startGame();
}, { passive: true });

cv.addEventListener("touchmove", (e) => {
  if (!touch || !player) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touch.x, dy = t.clientY - touch.y;
  if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
  player.want = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0);
  touch.x = t.clientX; touch.y = t.clientY;
}, { passive: true });

cv.addEventListener("touchend", () => { touch = null; }, { passive: true });

window.addEventListener("blur", () => { if (state === "play") pauseGame(); });
document.addEventListener("visibilitychange", () => {
  if (document.hidden){
    if (state === "play" || state === "ready") { saveRun(); pauseGame(); }
  }
});

/* ============================================================
   13. LOOP
   ============================================================ */
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  pollGamepad();
  if (state === "title") tGlobal += dt;
  else if (state !== "paused" && state !== "over") update(dt);
  render();
  requestAnimationFrame(frame);
}

/* ============================================================
   14. INIT
   ============================================================ */
loadBests();
mstLoad();
applyA11y();
maze = generateMaze();
food = { grid: [], total: 0, left: 0 };
pepper = null; fish = null; popups = []; feathers = []; ghosts = [];
player = makeEntity(1, 1, 0, 7.4, "player");
refreshAll();
titleScreen();
requestAnimationFrame(frame);

/* ---- gancho de teste (usado por test/harness.js) ---- */
window.__galinha = {
  CFG, DIFF, DIFF_KEYS, isZen,
  get state(){ return state; },
  get lives(){ return lives; },
  get level(){ return level; },
  get score(){ return score; },
  get best(){ return best; },
  get player(){ return player; },
  get ghosts(){ return ghosts; },
  get bonus(){ return bonus; },
  get bossLevel(){ return bossLevel; },
  get cloneAt(){ return cloneAt; },
  setLives(n){ lives = n; refreshStats(); },
  setLevel(n){ level = n; newLevel(false); },
  addScore(n){ addScore(n); },
  start(){ startGame(); },
  die(){ die(); },
  step(dt){ update(dt); },
  setDiff(d){ CFG.diff = d; best = bestByDiff[d] || 0; refreshAll(); },
  cfgCycle(k){ cfgCycle(k); },
  checkUpdates, appVersionCode, openSettings,
  checkContentUpdate, applyContentUpdate, autoContentUpdate, titleScreen,
  get ghostSpeed(){ return ghostSpeed(); },
  get playerSpeed(){ return playerSpeed(); },
  get recipe(){ return recipe; },
  bumpRecipe(id, n){ recipeBump(id, n); },
  get chapter(){ return chapter().name; }
};

})();
