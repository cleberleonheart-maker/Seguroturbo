<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7b2ff7">
<meta name="description" content="A galinha assada come açaí e peixe em um labirinto estilo Pac-Man, fugindo dos gatos.">
<title>Galinha Assada: Açaí &amp; Peixe</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Galinha">
<style>
  :root{
    --acai:#7b2ff7;
    --cream:#ffe9b8;
    --gold:#f59e0b;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:radial-gradient(1200px 800px at 50% -10%, #3b0a54 0%, #1a0524 45%, #0b0110 100%);
    color:var(--cream);
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;user-select:none;
  }
  #app{width:min(100vw,740px);height:100vh;height:100dvh;display:flex;flex-direction:column;gap:8px;padding:8px;overflow:hidden}

  header{
    flex:0 0 auto;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    padding:6px 12px;border-radius:14px;
    background:linear-gradient(180deg,rgba(123,47,247,.35),rgba(0,0,0,.35));
    border:1px solid rgba(255,233,184,.18);
    box-shadow:0 6px 24px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08);
  }
  .brand{display:flex;flex-direction:column;margin-right:auto;line-height:1.1}
  .brand b{font-size:15px;letter-spacing:.5px;text-shadow:0 0 12px rgba(192,38,211,.8)}
  .brand span{font-size:9px;opacity:.7;letter-spacing:2px;text-transform:uppercase}
  .stat{min-width:70px;text-align:center}
  .stat i{display:block;font-style:normal;font-size:9px;letter-spacing:2px;opacity:.6;text-transform:uppercase}
  .stat b{font-size:17px;color:#fff;text-shadow:0 0 10px rgba(245,158,11,.55)}
  #lives{display:flex;gap:3px;justify-content:center;height:20px;align-items:center}
  #lives canvas{width:19px;height:19px}

  #stage{position:relative;line-height:0;flex:1 1 auto;min-height:0;min-width:0;align-self:stretch;width:100%;display:flex;align-items:center;justify-content:center}
  canvas#game{
    width:100%;height:100%;max-width:100%;max-height:100%;display:block;border-radius:16px;object-fit:contain;
    background:#0d0116;
    box-shadow:0 0 0 2px rgba(255,233,184,.16), 0 0 34px rgba(123,47,247,.45), 0 18px 50px rgba(0,0,0,.6);
    touch-action:none;
  }

  #overlay{
    position:absolute;inset:0;border-radius:16px;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(60% 60% at 50% 45%, rgba(20,3,32,.86), rgba(6,0,12,.96));
    text-align:center;padding:16px;line-height:1.35;
  }
  #overlay.hidden{display:none}
  .panel{max-width:520px}
  h1{
    font-size:clamp(21px,5vw,38px);line-height:1.05;letter-spacing:1px;
    background:linear-gradient(180deg,#fff5d6 0%,#f59e0b 55%,#b45309 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 3px 0 rgba(0,0,0,.45));
  }
  h1 em{display:block;font-style:normal;font-size:.5em;color:#f0abfc;letter-spacing:4px;
    -webkit-text-fill-color:#f0abfc;margin-top:6px;text-shadow:0 0 18px rgba(192,38,211,.9)}
  .sub{font-size:13px;opacity:.85;margin:10px 0 4px}
  .legend{font-size:12px;opacity:.8;margin-top:8px}
  .keys{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0 6px;font-size:12px}
  .keys div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:9px;padding:5px 9px}
  kbd{background:#2b0b3f;border:1px solid rgba(255,255,255,.22);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-size:11px}
  .btn{
    margin-top:14px;cursor:pointer;border:0;border-radius:999px;padding:12px 26px;font:inherit;font-weight:700;
    font-size:16px;letter-spacing:1px;color:#2b0b00;
    background:linear-gradient(180deg,#ffd76a,#f59e0b 55%,#d97706);
    box-shadow:0 6px 0 #92400e, 0 10px 26px rgba(245,158,11,.35);
  }
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #92400e}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}
  .iconbtn{
    cursor:pointer;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);
    color:var(--cream);border-radius:12px;padding:11px 13px;font:inherit;font-size:13px
  }
  .iconbtn:hover{background:rgba(255,255,255,.14)}

  .menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-width:360px;margin:12px auto 0}
  .menu-grid .iconbtn{width:100%;font-size:11.5px;padding:10px 5px;line-height:1.2;overflow-wrap:anywhere}
  @media (max-width:360px){ .menu-grid{grid-template-columns:repeat(2,1fr)} }
  body.big-text .menu-grid .iconbtn{font-size:13px;padding:11px 6px}

  .cfg-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:360px;margin:14px auto}
  .cfg-grid .iconbtn{width:100%;font-size:12px;padding:10px 8px;line-height:1.25;overflow-wrap:anywhere}
  @media (max-width:340px){ .cfg-grid{grid-template-columns:1fr} }
  body.big-text .cfg-grid .iconbtn{font-size:14px;padding:11px 8px}

  footer{text-align:center;font-size:10px;opacity:.45;letter-spacing:1px}

  /* bolinha de controle no canto */
  #stick{
    display:none;position:fixed;z-index:40;
    left:calc(16px + env(safe-area-inset-left));bottom:calc(18px + env(safe-area-inset-bottom));
    width:134px;height:134px;border-radius:50%;
    background:radial-gradient(circle at 50% 42%, rgba(123,47,247,.34), rgba(20,3,32,.62));
    border:2px solid rgba(245,158,11,.42);
    box-shadow:0 0 22px rgba(0,0,0,.5), inset 0 0 26px rgba(0,0,0,.45);
    touch-action:none;-webkit-user-select:none;user-select:none;opacity:.72;
  }
  #stick.on{display:block}
  #stick.hit{opacity:1;border-color:rgba(245,158,11,.95);box-shadow:0 0 30px rgba(245,158,11,.55), inset 0 0 26px rgba(0,0,0,.35)}
  #stick::after{
    content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
    background:
      linear-gradient(to right,transparent calc(50% - 1px),rgba(255,255,255,.13) calc(50% - 1px),rgba(255,255,255,.13) calc(50% + 1px),transparent calc(50% + 1px)),
      linear-gradient(to bottom,transparent calc(50% - 1px),rgba(255,255,255,.13) calc(50% - 1px),rgba(255,255,255,.13) calc(50% + 1px),transparent calc(50% + 1px));
  }
  #knob{
    position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;
    background:radial-gradient(circle at 38% 32%, #fff3cf, #f59e0b 58%, #b45309);
    box-shadow:0 3px 0 #7c2d12, 0 6px 16px rgba(0,0,0,.55);
    pointer-events:none;transition:transform .06s linear;
  }
  #stick.hit #knob{transition:none}

  /* aviso de controle conectado */
  #gpbadge{
    display:none;position:fixed;z-index:41;
    left:50%;transform:translateX(-50%);top:calc(8px + env(safe-area-inset-top));
    font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:#fcd34d;
    background:rgba(20,3,32,.74);border:1px solid rgba(245,158,11,.42);
    border-radius:999px;padding:6px 12px;pointer-events:none
  }
  #gpbadge.on{display:block}

  /* celular estreito: cabecalho compacto para o botao do controle caber */
  @media (max-width: 420px){
    header{gap:6px;padding:6px 8px}
    .brand b{font-size:13px}
    .brand span{font-size:8px;letter-spacing:1px}
    .stat{min-width:54px}
    .stat b{font-size:15px}
    .stat i{font-size:8px;letter-spacing:1px}
    #gpdbgbtn{font-size:10px;padding:7px 8px}
  }

  /* telas largas / modo paisagem */
  #stage{outline:1px solid rgba(123,47,247,.28);border-radius:16px}
  @media (orientation: landscape) and (max-height: 560px){
    footer{display:none}
    #app{padding:6px;gap:8px}
  }
  @media (min-width: 680px) and (orientation: landscape){
    #app{flex-direction:row;align-items:stretch;gap:14px;padding:14px}
    header{flex:0 0 200px;flex-direction:column;justify-content:center;text-align:center;gap:12px;margin-right:0}
    .brand{margin-right:0}
    .brand b{font-size:16px}
    .brand span{font-size:9px}
    #stick{opacity:.95}
    #stage{flex:1 1 auto}
    #overlay{border-radius:16px}
  }
  @media (min-width: 1040px) and (orientation: portrait){
    #app{height:auto;min-height:100vh}
    body{align-items:flex-start}
  }

  /* acessibilidade */
  body.big-text .brand b{font-size:18px}
  body.big-text .brand span{font-size:10px}
  body.big-text .stat i{font-size:10px}
  body.big-text .stat b{font-size:21px}
  body.big-text .stat{min-width:76px}
  body.big-text .sub{font-size:15px}
  body.big-text .legend{font-size:14px}
  body.big-text .iconbtn{font-size:15px;padding:12px 14px}
  body.big-text .keys{font-size:14px}
  body.big-text .keys div{padding:6px 11px}
  body.big-text footer{font-size:12px}
  body.contrast header{background:linear-gradient(180deg,rgba(0,0,0,.8),rgba(0,0,0,.8));border-color:rgba(255,255,255,.5)}
  body.contrast .iconbtn{background:rgba(0,0,0,.6);border-color:rgba(255,255,255,.5)}
  body.contrast #overlay{background:radial-gradient(60% 60% at 50% 45%, rgba(0,0,0,.95), rgba(0,0,0,.99))}
  body.contrast footer{opacity:.8}
  body.reduce-motion #knob{transition:none}
  body.reduce-motion .btn:active{transform:none}
  body.reduce-motion #toast{transition:none}

  /* aviso flutuante */
  #toast{
    position:fixed;z-index:60;left:50%;top:calc(8px + env(safe-area-inset-top));
    transform:translate(-50%,-26px);pointer-events:none;opacity:0;
    background:rgba(20,3,32,.94);border:1px solid rgba(245,158,11,.6);
    color:#ffe9b8;border-radius:999px;padding:9px 16px;font-size:13px;font-weight:700;
    letter-spacing:.4px;box-shadow:0 8px 30px rgba(0,0,0,.55);max-width:min(92vw,520px);
    text-align:center;transition:transform .28s ease,opacity .28s ease;
  }
  #toast.on{transform:translate(-50%,0);opacity:1}

  #recipeBar{
    display:none;margin:0 auto;max-width:560px;width:100%;text-align:center;font-size:11.5px;line-height:1.4;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:4px 12px
  }
  #recipeBar.done{color:#facc15;border-color:rgba(250,204,21,.55);background:rgba(250,204,21,.10)}
  body.big-text #recipeBar{font-size:13px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><b>GALINHA ASSADA</b><span>açaí &amp; peixe</span></div>
    <div class="stat"><i>Pontos</i><b id="score">0</b></div>
    <div class="stat"><i>Recorde</i><b id="best">0</b></div>
    <div class="stat"><i>Fase</i><b id="level">1</b></div>
    <div class="stat"><i>Vidas</i><div id="lives"></div></div>
    <button class="iconbtn" id="gpdbgbtn" style="font-size:11px;padding:8px 10px;border-color:rgba(245,158,11,.6);color:#fcd34d" aria-label="diagnostico do controle">CTRL</button>
  </header>

  <div id="recipeBar"></div>

  <div id="stage">
    <canvas id="game" width="672" height="672"></canvas>
    <div id="overlay"><div class="panel" id="panel"></div></div>
  </div>

  <footer>Bolinha no canto / analógico do controle / setas do teclado / WASD / swipe &nbsp;&bull;&nbsp; P pausa &nbsp;&bull;&nbsp; M som</footer>
</div>

<div id="stick" role="application" aria-label="Controle da galinha"><div id="knob"></div></div>
<div id="gpbadge">controle conectado</div>
<div id="toast"></div>

<script>
(() => {
"use strict";

/* ============================================================
   1. CONSTANTES
   ============================================================ */
const T = 32;                 // tile
const COLS = 21, ROWS = 21;   // labirinto 21x21
const W = COLS * T, H = ROWS * T;

// direcoes: 0 = cima, 1 = direita, 2 = baixo, 3 = esquerda
const DR = [-1, 0, 1, 0];
const DC = [0, 1, 0, -1];
const ANG = [-Math.PI / 2, 0, Math.PI / 2, Math.PI];
const OPP = [2, 3, 0, 1];

const OPEN = 0, WALL = 1, DOOR = 2, HOUSE = 3;

const HOUSE_ROWS = [9, 10, 11];
const HOUSE_COLS = [8, 9, 10, 11, 12];
const HOUSE_CENTER = [10, 10];
const DOOR_TILE = [8, 10];
const EXIT_TILE = [7, 10];
const GHOST_SPAWN = [[10, 10], [10, 9], [10, 11], [11, 12]];

const PAL = [
  { bg:"#0d0116", wall:"#3b0f63", wallEdge:"#c026d3" },
  { bg:"#050a13", wall:"#0f2a63", wallEdge:"#0ea5e9" },
  { bg:"#0f0a13", wall:"#5b0f63", wallEdge:"#ec4899" },
  { bg:"#130b0a", wall:"#7c1f0f", wallEdge:"#f59e0b" },
  { bg:"#0a130f", wall:"#0f6340", wallEdge:"#22c55e" },
  { bg:"#130a13", wall:"#2d0f63", wallEdge:"#a78bfa" },
  { bg:"#0a1013", wall:"#0f4756", wallEdge:"#38bdf8" },
  { bg:"#13100a", wall:"#63540f", wallEdge:"#facc15" },
  { bg:"#130a0f", wall:"#631f2f", wallEdge:"#f87171" }
];
const C = Object.assign({}, PAL[0], { pellet: "#b56cff", pepper: "#ef4444", pepperStem: "#22c55e", fish: "#38bdf8", fishDark: "#0369a1" });

/* capitulos: 5 fases com a mesma cara (paleta) e um nome proprio */
const CHAPTERS = [
  { name:"Cozinha do açaí",    pal:0 },
  { name:"Forno aceso",        pal:3 },
  { name:"Pista da madrugada", pal:1 },
  { name:"Horta do bairro",    pal:4 },
  { name:"Maré de peixe",      pal:6 },
  { name:"Festa da galinha",   pal:2 }
];
function chapterOf(lv){ return Math.min(CHAPTERS.length - 1, Math.floor((lv - 1) / 5)); }
function chapter(){ return CHAPTERS[chapterOf(level)]; }


/* ---- receita da fase: objetivo extra de cada fase ---- */
const RECIPES = [
  { id:"fish",   txt:(n) => "assar " + n + " peixe" + (n > 1 ? "s" : ""), need:(lv) => 2 + Math.floor(lv / 8) },
  { id:"pellet", txt:(n) => "comer " + n + " açaí" + (n > 1 ? "s" : ""),     need:(lv) => 25 + lv * 2 },
  { id:"ghost",  txt:(n) => "fritar " + n + " gato" + (n > 1 ? "s" : ""),     need:(lv) => 1 + Math.floor(lv / 6) },
  { id:"combo",  txt:(n) => "combo de açaí x" + n,                           need:(lv) => 3 }
];
let recipe = null;
function makeRecipe(lv){
  if (bonus){ recipe = null; return; }
  if (lv % 5 === 0){ recipe = { id:"boss", txt:"derrotar o gato chefe", need:1, cur:0, done:false }; return; }
  const pick = RECIPES[(lv * 3 + 1) % RECIPES.length];
  const need = Math.max(1, pick.need(lv));
  recipe = { id:pick.id, txt:pick.txt(need), need:need, cur:0, done:false };
}
function recipeBump(id, n){
  if (!recipe || recipe.done || recipe.id !== id) return;
  recipe.cur = Math.min(recipe.need, recipe.cur + n);
  if (recipe.cur >= recipe.need){
    recipe.done = true;
    PROG.recipes = (PROG.recipes || 0) + 1;
    addScore(500);
    popups.push({ r:player.r, c:player.c, text:"RECEITA PRONTA!", t:0, color:"#facc15" });
    toast("RECEITA PRONTA! +500 pontos", "#facc15");
    saveProg(); checkAch();
  }
  refreshRecipe();
}

const BEST_KEY = "galinhaAssadaBest";
const DAY_KEY = "galinhaAssadaDay";
const store = {
  get(k){ try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch (e) {} },
  del(k){ try { localStorage.removeItem(k); } catch (e) {} }
};

/* ---- configuracoes salvas ---- */
const CFG_KEY = "galinhaAssadaCfg";
const SIZES = { small: 104, normal: 134, large: 170 };
const DIFF = {
  easy:   { ghost: 0.88, fright: 1.35, player: 0.96, lives: 4, label: "FÁCIL" },
  normal: { ghost: 1,    fright: 1,    player: 1,    lives: 3, label: "NORMAL" },
  hard:   { ghost: 1.10, fright: 0.70, player: 1.05, lives: 2, label: "DIFÍCIL" },
  // Zen: sem derrota. Os gatos continuam caçando (e o chefe e o clone continuam
  // aparecendo), mas a galinha nunca perde a vida e o jogo nunca acaba.
  zen:    { ghost: 0.85, fright: 1.40, player: 1,    lives: 3, label: "ZEN" }
};
function isZen(){ return CFG.diff === "zen"; }
const CFG = Object.assign(
  { stick: true, side: "left", size: "normal", vol: 0.7, muted: false, vibrate: true, diff: "normal",
    reduceMotion: false, contrast: false, bigText: false, nick: null, server: null },
  readCfg()
);
const DIFF_KEYS = ["easy", "normal", "hard", "zen"];
function readCfg(){ try { return JSON.parse(store.get(CFG_KEY) || "{}") || {}; } catch (e) { return {}; } }
function dayKey(){ try { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); } catch (e) { return "0"; } }
function saveCfg(){ store.set(CFG_KEY, JSON.stringify(CFG)); }

const Buzz = {
  ok(ms){ if (!CFG.vibrate) return; try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }
};

/* ---- leitura/escrita de JSON ---- */
function readJSON(k, d){
  try { const v = JSON.parse(store.get(k) || "null"); return v === null || v === undefined ? d : v; }
  catch (e) { return d; }
}

/* ---- recordes por dificuldade ---- */
let bestByDiff = {};
function loadBests(){
  DIFF_KEYS.forEach(k => { bestByDiff[k] = Number(store.get(BEST_KEY + "_" + k) || 0) || 0; });
  const legacy = Number(store.get(BEST_KEY) || 0) || 0;
  if (legacy && !bestByDiff.easy && !bestByDiff.normal && !bestByDiff.hard) bestByDiff[CFG.diff] = legacy;
}
function globalBest(){ let m = 0; for (const k of DIFF_KEYS) if (bestByDiff[k] > m) m = bestByDiff[k]; return m; }
function bumpBest(){
  if (score > (bestByDiff[CFG.diff] || 0)){
    bestByDiff[CFG.diff] = score;
    store.set(BEST_KEY + "_" + CFG.diff, String(score));
  }
  if (score > globalBest()) store.set(BEST_KEY, String(score));
  best = bestByDiff[CFG.diff] || 0;
}

/* ---- progresso do jogador ---- */
const PROG_KEY = "galinhaAssadaProg";
const ACH_KEY = "galinhaAssadaAch";
const RUN_KEY = "galinhaAssadaRun";
const PROG_KIND_DEFAULT = { games:0, clears:0, ghosts:0, fish:0, fruits:0, maxCombo:1, maxLevel:1,
  bossKills:0, shields:0, magnets:0, slows:0, bestFrightCombo:0, noDeathClear:0, coins:0, chilis:0, masters:0, bonusClears:0, clones:0, recipes:0 };
const PROG_DEFAULT = PROG_KIND_DEFAULT;
let PROG = Object.assign({}, PROG_DEFAULT, readJSON(PROG_KEY, {}));
let ACH_UNLOCKED = readJSON(ACH_KEY, {}) || {};
function saveProg(){ store.set(PROG_KEY, JSON.stringify(PROG)); }
function saveAch(){ store.set(ACH_KEY, JSON.stringify(ACH_UNLOCKED)); }

/* ---- partida salva (continuar) ---- */
function saveRun(){
  if (state === "over" || state === "title") return;
  store.set(RUN_KEY, JSON.stringify({ score, lives, level, diff: CFG.diff, at: Date.now() }));
}
function loadRun(){
  const r = readJSON(RUN_KEY, null);
  if (!r || !r.level || !r.lives || r.lives <= 0 || r.score === undefined) return null;
  return r;
}
function clearRun(){ store.del(RUN_KEY); }

/* ---- missão do dia ---- */
const MST_KEY = "galinhaAssadaMst";
const MISSIONS = [
  { name:"COMER 6 GATOS",      need: m => m.g, target: 6 },
  { name:"COMER 3 PEIXES",     need: m => m.f, target: 3 },
  { name:"ZERAR 2 FASES",      need: m => m.c, target: 2 },
  { name:"JUNTAR 5 MOEDAS",    need: m => m.k, target: 5 },
  { name:"FAZER 3.000 PONTOS", need: m => m.p, target: 3000 },
  { name:"CHEGAR À FASE 4",    need: m => m.l, target: 4 }
];
let mst = null;
function mstLoad(){
  const d = dayKey();
  mst = readJSON(MST_KEY, null);
  if (!mst || mst.day !== d){
    const seed = Array.from(d).reduce((a, ch) => (a + ch.charCodeAt(0) * 31) | 0, 7);
    mst = { day: d, i: ((seed % MISSIONS.length) + MISSIONS.length) % MISSIONS.length,
            g: 0, f: 0, c: 0, k: 0, p: 0, l: 1, done: false };
    store.set(MST_KEY, JSON.stringify(mst));
  }
  return mst;
}
function mstBump(key){
  const m = mst && mst.day === dayKey() ? mst : mstLoad();
  if (m.done) return;
  m[key]++;
  store.set(MST_KEY, JSON.stringify(m));
  mstCheck();
}
function mstSync(){
  const m = mst && mst.day === dayKey() ? mst : mstLoad();
  if (m.done) return;
  m.p = Math.max(m.p, score);
  m.l = Math.max(m.l, level);
  store.set(MST_KEY, JSON.stringify(m));
  mstCheck();
}
function mstCheck(){
  const m = mst;
  if (!m || m.done) return;
  const M = MISSIONS[m.i];
  if (!M || M.need(m) < M.target) return;
  m.done = true;
  store.set(MST_KEY, JSON.stringify(m));
  Sound.ach();
  Buzz.ok([40, 60, 100]);
  toast("MISSÃO DO DIA: " + M.name + "!", "#f472b6");
}

let updateContent = null;
function buildOf(text){
  const m = /GAME_BUILD\s*=\s*["']([^"']+)["']/.exec(String(text || ""));
  return m ? m[1] : "";
}
function decodeContent(txt){
  const t = String(txt || "");
  // a API do GitHub devolve JSON com o arquivo em base64
  if (t.charAt(0) === "{" && t.indexOf('"content"') > 0){
    try {
      const d = JSON.parse(t);
      if (d && d.encoding === "base64" && d.content) return atob(d.content.replace(/\s/g, ""));
    } catch (e) { }
  }
  return t;
}
// quebra o cache sem estragar a URL que ja tem query (?ref=main)
function bust(u){ return u + (u.indexOf("?") >= 0 ? "&" : "?") + "t=" + Date.now(); }
async function fetchGameContent(){
  // vao na ordem: a primeira que responder ganha (a API do GitHub e a mais rapida)
  let erro = null;
  for (const u of GAME_CONTENT_URLS){
    try {
      const r = await fetchOnline(bust(u), { method: "GET", cache: "no-store" }, 30000);
      if (!r.ok) throw new Error("HTTP " + r.status);
      const txt = decodeContent(await r.text());
      const b = buildOf(txt);
      if (!b) throw new Error("resposta sem marcador");
      return { build: b, text: txt, url: u };
    } catch (e){ erro = e; }
  }
  throw erro || new Error("não consegui baixar o jogo novo");
}

async function fetchRemoteSha(){
  const r = await fetchOnline(bust(GAME_COMMIT_API), { method: "GET", cache: "no-store" }, 20000);
  if (!r.ok) throw new Error("HTTP " + r.status);
  const d = await r.json();
  const c = Array.isArray(d) ? d[0] : d;
  return (c && c.sha) ? String(c.sha) : "";
}
async function checkContentUpdate(){
  if (!canSelfUpdate()) return null;
  let sha = "";
  try { sha = await fetchRemoteSha(); } catch (e){ sha = ""; }
  if (sha && store.get(SHA_KEY) === sha) return null;   // ja esta na ultima
  const c = await fetchGameContent();
  if (sha) store.set(SHA_KEY, sha);
  if (!c || c.build === GAME_BUILD) return null;
  return c;
}

async function checkUpdates(){
  toast("Verificando atualizações…", "#38bdf8");
  // 1o) o proprio jogo (atualiza direto, sem instalar nada)
  try {
    const upd = await checkContentUpdate();
    if (upd){
      updateContent = upd;
      updateState = "nova " + upd.build;
      const fromCfg = !!(ui.panel && ui.panel.querySelector('[data-act="update"]'));
      showOverlay(`
        <h1>NOVO JOGO<em>${upd.build}</em></h1>
        <div class="sub">Atualiza direto no app, sem baixar nem instalar APK.</div>
        <div class="row">

      return;
    }
  } catch (e){ /* sem internet: cai no teste do APK */ }
  // 2o) o aplicativo em si (APK)
  try {
    const r = await fetchOnline(FDOID_INDEX, { method: "GET" }, 25000);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const xml = new DOMParser().parseFromString(await r.text(), "text/xml");
    const pkgs = xml.getElementsByTagName("package");
    let found = null;
    for (let i = 0; i < pkgs.length; i++){
      const an = pkgs[i].getElementsByTagName("apkname")[0];
      const name = an ? String(an.textContent || "") : "";
      if (name.indexOf("br.com.galinhaassada_") === 0){ found = pkgs[i]; break; }
    }
    if (!found) throw new Error("pacote nao encontrado");
    const get = (t) => { const e = found.getElementsByTagName(t)[0]; return e ? String(e.textContent || "").trim() : ""; };
    const vc = parseInt(get("versioncode"), 10) || 0;
    const vn = get("version") || "?";
    const size = parseInt(get("size"), 10) || 0;
    const apk = get("apkname");
    const cur = appVersionCode();
    if (cur && vc <= cur){
      updateState = "atualizado";
      toast("Você já está na última versão (" + vn + ")", "#4ade80");
      if (ui.panel && ui.panel.querySelector('[data-act="update"]')) renderSettings();
      return;
    }
    updateState = "nova " + vn;
    const fromCfg = !!(ui.panel && ui.panel.querySelector('[data-act="update"]'));
    updateInfo = { url: FDOID_BASE + apk, vn: vn, vc: vc, size: size, fromCfg: fromCfg, file: apk };
    showOverlay(`
      <h1>NOVA VERSÃO<em>${updateInfo.vn}</em></h1>
      <div class="sub">Código ${updateInfo.vc}${updateInfo.size ? " &bull; " + Math.round(updateInfo.size / 1024) + " KB" : ""}</div>
      <div class="row">
        <button class="btn" data-act="updatedl">BAIXAR</button>
        <button class="iconbtn" data-act="updateclose">FECHAR</button>
      </div>`);
  } catch (e){
    updateState = "sem net";
    toast("Não consegui verificar agora (sem internet?)", "#f87171");
    if (ui.panel && ui.panel.querySelector('[data-act="update"]')) renderSettings();
  }
}

const Sound = {
  swoosh(){ this.tone(760, 0.14, "sawtooth", 0.03, 320); },
  ac: null, muted: CFG.muted, vol: CFG.vol, master: null, siren: null, lfo: null, sirenLevel: 0,
  musicOn: CFG.music !== false,
  startMusic(lv){
    if (!this.ac || this.muted || !this.musicOn) return;
    if (this.musicTimer) return;
    lv = lv || 1;
    const bases = [220, 196, 247, 175, 261, 233, 208, 294, 185, 165, 311, 196];
    const base = bases[(lv - 1) % bases.length] || 220;
    const scale = [1, 1.125, 1.25, 1.5, 1.667, 1.875, 2];
    const self = this;
    let mi = 0;
    this.musicStep = function(at){
      const n = scale[mi % scale.length];
      self.toneNote(base * n, 0.17, "triangle", 0.011, at);
      mi++;
      if (mi % 8 === 6) self.toneNote(base * 1.5, 0.2, "sine", 0.012, at);
      if (mi % 8 === 0) self.toneNote(base * 0.5, 0.32, "sine", 0.016, at);
    };
    // agendamento com lookahead: mantém o ritmo mesmo se o setInterval atrasar
    const STEP = 0.196, HORIZON = 0.35;
    this.nextAt = this.ac.currentTime + 0.06;
    this.scheduleSome = function(){
      if (!this.ac) return;
      const h = this.ac.currentTime + HORIZON;
      while (this.nextAt < h){
        try { this.musicStep(this.nextAt); } catch (e) {}
        this.nextAt += STEP;
      }
    };
    this.scheduleSome();
    this.musicTimer = setInterval(() => { try { self.scheduleSome(); } catch (e) {} }, 120);
  },
  toneNote(freq, dur = 0.16, type = "triangle", vol = 0.012, at){
    if (!this.ac || this.muted) return;
    const t = (at != null && at > this.ac.currentTime) ? at : this.ac.currentTime;
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.014);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.out());
    o.start(t); o.stop(t + dur + 0.03);
  },
  stopMusic(){
    if (this.musicTimer){ clearInterval(this.musicTimer); this.musicTimer = null; }
    this.musicStep = null;
  },
  init(){
    if (this.ac) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ac = new AC(); } catch (e) { this.ac = null; return; }
    try {
      this.master = this.ac.createGain();
      this.master.gain.value = this.muted ? 0 : this.vol;
      this.master.connect(this.ac.destination);
    } catch (e) { this.master = null; }
  },
  resume(){ if (this.ac && this.ac.state === "suspended") this.ac.resume(); },
  out(){ return this.master || this.ac.destination; },
  setVolume(v){
    this.vol = Math.max(0, Math.min(1, v));
    CFG.vol = this.vol;
    if (this.muted && this.vol > 0) this.muted = false;
    if (this.master) this.master.gain.value = this.muted ? 0 : this.vol;
    if (this.ac && this.muted) this.stopSiren();
  },
  tone(freq, dur = 0.07, type = "square", vol = 0.05, slideTo = null){
    if (this.muted || !this.ac) return;
    const t = this.ac.currentTime;
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.out());
    o.start(t); o.stop(t + dur + 0.03);
  },
  seq(list, type, vol, step){
    list.forEach((f, i) => setTimeout(() => this.tone(f, step ? step * 1.4 : 0.09, type || "square", vol), i * (step || 50)));
  },
  waka(alt){ this.tone(alt ? 330 : 210, 0.055, "square", 0.03); },
  eatFish(){ this.tone(520, 0.09, "triangle", 0.06, 980); },
  power(){ this.seq([330, 440, 660, 880], "sawtooth", 0.05, 55); },
  eatFruit(){ this.seq([784, 988, 1175, 1568], "triangle", 0.07, 60); },
  eatGhost(){ this.seq([700, 950, 1250], "square", 0.06, 45); },
  die(){ this.tone(420, 0.9, "sawtooth", 0.07, 45); },
  clear(){ this.seq([523, 659, 784, 1046], "triangle", 0.06, 110); },
  extra(){ this.seq([880, 1175, 1568], "square", 0.05, 70); },
  ach(){ this.seq([784, 1046, 1318, 1568], "triangle", 0.06, 75); },
  powerup(){ this.seq([523, 784, 1046], "square", 0.05, 45); },
  coin(){ this.seq([1320, 1760], "square", 0.035, 55); },
  combo(n){ this.tone(300 * (n || 1), 0.08, "square", 0.025, 1200); },
  bossWarn(){ this.seq([170, 135, 110], "sawtooth", 0.05, 120); },
  startSiren(level){
    if (!this.ac || this.siren || this.muted) return;
    this.sirenLevel = level;
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    const lfo = this.ac.createOscillator(), lg = this.ac.createGain();
    o.type = "sawtooth"; o.frequency.value = 110 + level * 8;
    g.gain.value = 0.015;
    lfo.type = "sine"; lfo.frequency.value = (2.2 + level * 0.25) * (hurry ? 1.45 : 1); lg.gain.value = 40;
    lfo.connect(lg); lg.connect(o.frequency);
    o.connect(g); g.connect(this.out());
    try { o.start(); lfo.start(); } catch (e) { return; }
    this.siren = o; this.lfo = lfo;
  },
  sirenHurry(){
    if (!this.lfo) return;
    this.lfo.frequency.value = (2.2 + (this.sirenLevel || 0) * 0.25) * (hurry ? 1.45 : 1);
  },
  stopSiren(){
    if (this.siren){ try { this.siren.stop(); this.lfo.stop(); } catch (e) {} }
    this.siren = null; this.lfo = null;
  },
  toggle(){

  }
};

/* ============================================================
   5. LABIRINTO
   ============================================================ */
function inHouseArea(r, c){
  return HOUSE_ROWS.indexOf(r) !== -1 && HOUSE_COLS.indexOf(c) !== -1;
}

function generateMaze(){
  const g = [];
  for (let r = 0; r < ROWS; r++) g.push(new Array(COLS).fill(WALL));

  // DFS em celulas impares -> labirinto perfeito e conectado.
  // A area da casa dos gatos fica bloqueada aqui para o gerador nunca
  // criar um corredor que passe por dentro dela.
  const free = (r, c) => !inHouseArea(r, c);
  const stack = [[1, 1]];
  g[1][1] = OPEN;
  const deltas = [[2, 0], [-2, 0], [0, 2], [0, -2]];
  while (stack.length){
    const cur = stack[stack.length - 1];
    const opts = [];
    for (const d of deltas){
      const nr = cur[0] + d[0], nc = cur[1] + d[1];
      if (nr <= 0 || nr >= ROWS - 1 || nc <= 0 || nc >= COLS - 1) continue;
      if (g[nr][nc] !== WALL) continue;
      if (!free(nr, nc)) continue;
      opts.push(d);
    }
    if (!opts.length){ stack.pop(); continue; }
    const d = opts[(Math.random() * opts.length) | 0];
    const midR = cur[0] + d[0] / 2, midC = cur[1] + d[1] / 2;
    const nr = cur[0] + d[0], nc = cur[1] + d[1];
    g[midR][midC] = OPEN;
    g[nr][nc] = OPEN;
    stack.push([nr, nc]);
  }

  // remove paredes para criar circuits (estilo pac-man)
  const target = Math.floor(COLS * ROWS * 0.075);
  let tries = 0, removed = 0;
  while (removed < target && tries++ < 6000){
    const r = 1 + ((Math.random() * (ROWS - 2)) | 0);
    const c = 1 + ((Math.random() * (COLS - 2)) | 0);
    if (g[r][c] !== WALL) continue;
    let openN = 0;
    for (let d = 0; d < 4; d++) if (g[r + DR[d]][c + DC[d]] === OPEN) openN++;
    if (openN < 2) continue;
    g[r][c] = OPEN; removed++;
  }

  // casa dos gatos + porta + alcate de saida
  for (const r of HOUSE_ROWS) for (const c of HOUSE_COLS) g[r][c] = HOUSE;
  g[DOOR_TILE[0]][DOOR_TILE[1]] = DOOR;
  g[EXIT_TILE[0]][EXIT_TILE[1]] = OPEN;
  g[HOUSE_CENTER[0]][HOUSE_CENTER[1]] = HOUSE;
  // garante que a saida da casa se ligue ao labirinto
  g[6][10] = OPEN; g[7][9] = OPEN; g[7][11] = OPEN;

  // tunel nas bordas: sai pela esquerda e aparece na direita
  for (const c of [0, 1, COLS - 2, COLS - 1]) g[10][c] = OPEN;

  maze = g;
  ensureConnected();
  return maze;
}

function bfsReach(sr, sc, who){
  const seen = new Uint8Array(ROWS * COLS);
  const s = sr * COLS + sc;
  seen[s] = 1;
  const q = [s];
  let head = 0;
  while (head < q.length){
    const cur = q[head++];
    const r = (cur / COLS) | 0, c = cur % COLS;
    for (let d = 0; d < 4; d++){
      const nr = r + DR[d], nc = c + DC[d];
      if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
      const id = nr * COLS + nc;
      if (seen[id] || !walkable(nr, nc, who)) continue;
      seen[id] = 1; q.push(id);
    }
  }
  return seen;
}

// garante que TODO o corredor (comida) seja alcancavel -> fase sempre terminavel
function ensureConnected(){
  for (let guard = 0; guard < 80; guard++){
    const start = nearestTileFrom(ROWS - 2, 1, "player");
    const reach = bfsReach(start[0], start[1], "player");
    let bad = -1;
    for (let r = 0; r < ROWS && bad < 0; r++)
      for (let c = 0; c < COLS; c++)
        if (maze[r][c] === OPEN && !reach[r * COLS + c]){ bad = r * COLS + c; break; }
    if (bad < 0) return;

    // BFS do tile orfao ate a regiao alcancavel, sem furar a casa/porta
    const prev = new Int16Array(ROWS * COLS).fill(-1);
    const seen = new Uint8Array(ROWS * COLS);
    seen[bad] = 1;
    const q = [bad];
    let head = 0, goal = -1;
    while (head < q.length && goal < 0){
      const cur = q[head++];
      const r = (cur / COLS) | 0, c = cur % COLS;
      for (let d = 0; d < 4; d++){
        const nr = r + DR[d], nc = c + DC[d];
        if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
        const id = nr * COLS + nc;
        if (seen[id]) continue;
        const t = maze[nr][nc];
        if (t === HOUSE || t === DOOR) continue;
        seen[id] = 1; prev[id] = cur;
        if (reach[id]){ goal = id; break; }
        q.push(id);
      }
    }
    if (goal < 0){ maze[(bad / COLS) | 0][bad % COLS] = WALL; continue; } // caso degenerado
    let node = goal, guard2 = 0;
    while (prev[node] !== bad && guard2++ < ROWS * COLS){
      maze[(node / COLS) | 0][node % COLS] = OPEN;
      if (prev[node] < 0) break;
      node = prev[node];
    }
  }
}

function walkable(r, c, who){
  if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return false;
  const t = maze[r][c];
  if (t === WALL) return false;
  if (t === DOOR || t === HOUSE) return who === "ghostLeave";
  return true;
}
function canStep(e, r, c){ return walkable(r, c, e.who); }

// campo de distancia (ignora paredes) -> heuristica simples e sempre valida
// usa um buffer reaproveitado: o retorno e consumido na hora (nunca guardado)
let _distBuf = null;
function distField(tr, tc){
  const tr2 = Math.max(0, Math.min(ROWS - 1, tr));
  const tc2 = Math.max(0, Math.min(COLS - 1, tc));
  const n = ROWS * COLS;
  if (!_distBuf || _distBuf.length !== n) _distBuf = new Int16Array(n);
  const dist = _distBuf;
  dist.fill(-1);
  const q = [tr2 * COLS + tc2];
  dist[q[0]] = 0;
  let head = 0;
  while (head < q.length){
    const cur = q[head++];
    const r = (cur / COLS) | 0, c = cur % COLS;
    for (let d = 0; d < 4; d++){
      const nr = r + DR[d], nc = c + DC[d];
      if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
      const id = nr * COLS + nc;
      if (dist[id] !== -1) continue;
      dist[id] = dist[cur] + 1;
      q.push(id);
    }
  }
  return dist;
}

function nearestTileFrom(startR, startC, want){
  // BFS ignorando o valor do tile; devolve o tile CAMINHAVEL mais proximo
  const ok = (r, c) => walkable(r, c, want);
  if (ok(startR, startC)) return [startR, startC];
  const seen = new Uint8Array(ROWS * COLS);
  const s = startR * COLS + startC;
  const q = [s]; seen[s] = 1;
  let head = 0;
  while (head < q.length){
    const cur = q[head++];
    const r = (cur / COLS) | 0, c = cur % COLS;
    for (let d = 0; d < 4; d++){
      const nr = r + DR[d], nc = c + DC[d];
      if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
      const id = nr * COLS + nc;
      if (seen[id]) continue;
      seen[id] = 1;
      if (ok(nr, nc)) return [nr, nc];
      q.push(id);
    }
  }
  return [startR, startC];
}

function nearestFoodTile(tr, tc){
  let bt = null, bd = 1e9;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++){
    if (!food.grid[r][c]) continue;
    const d = (r - tr) * (r - tr) + (c - tc) * (c - tc);
    if (d < bd){ bd = d; bt = [r, c]; }
  }
  return bt;
}

/* ============================================================
   6. ENTIDADES
   ============================================================ */
function makeEntity(r, c, dir, speed, who){
  return { r, c, dir, want: dir, prog: 0, ox: 0, oy: 0, speed, baseSpeed: speed, who, blocked: true, moving: false };
}

// corta a quina: ao virar antes do centro, guarda o resto do deslocamento em px
function addCorner(e, prevDir, prog){
  e.ox += DC[prevDir] * prog * T;
  e.oy += DR[prevDir] * prog * T;
  const lim = T * 0.5, m = Math.hypot(e.ox, e.oy);
  if (m > lim){ e.ox *= lim / m; e.oy *= lim / m; }
}

// tunel (linha 10): a coluna fora do labirinto volta para o outro lado
function wrapCol(r, c){
  if (r !== 10) return c;
  if (c < 0) return COLS - 1;
  if (c >= COLS) return 0;
  return c;
}

// janela de virada: a galinha pode adiantar a curva; gatos decidem so no centro
function canTurnNow(e){
  if (e.prog > 0.04 && e.prog <= 0.52) return e.who === "player";  // corte de quina
  return e.prog <= 0.04;                                          // no centro: sempre
}

function advance(e, dt, onCenter){
  // e.prog = fracao entre o centro do tile atual e o centro do proximo
  let budget = e.speed * dt;
  const start = budget;
  let guard = 0;
  while (guard++ < 8){
    if (onCenter) onCenter(e);           // oportunidad de escolher direcao
    const reverte = e.want === OPP[e.dir];
    if ((reverte || canTurnNow(e)) && canStep(e, e.r + DR[e.want], wrapCol(e.r, e.c + DC[e.want]))){
      if (e.dir !== e.want && e.prog > 0){
        if (reverte){                      // meia-volta: volta pelo mesmo corredor
          const vr = e.r + DR[e.dir];
          e.c = wrapCol(e.r, e.c + DC[e.dir]);
          e.r = vr;
          e.prog = 1 - e.prog;
        } else {                           // quina: desvio em px e centro zera
          addCorner(e, e.dir, e.prog);
          e.prog = 0;
        }
      }
      e.dir = e.want;
    }
    e.blocked = !canStep(e, e.r + DR[e.dir], wrapCol(e.r, e.c + DC[e.dir]));
    if (e.blocked) break;
    const need = 1 - e.prog;
    if (budget < need){ e.prog += budget; budget = 0; break; }
    budget -= need;
    e.prog = 0;
    const nr = e.r + DR[e.dir], nc = wrapCol(e.r, e.c + DC[e.dir]);
    if (canStep(e, nr, nc)){ e.r = nr; e.c = nc; }
    else { e.blocked = true; break; }
  }
  e.moving = !e.blocked;

  // o desvio da quina converge conforme anda (mais rapido parado ou no centro)
  let gone = start - budget;                       // distancia percorrida, em tiles
  if (gone <= 0.01) gone = e.speed * dt * 1.5;      // parado: converge suave, sem salto
  const decay = gone * T;                          // em pixels
  if (e.ox) e.ox -= Math.sign(e.ox) * Math.min(Math.abs(e.ox), decay);
  if (e.oy) e.oy -= Math.sign(e.oy) * Math.min(Math.abs(e.oy), decay);
}

function entPos(e){
  return {
    x: (e.c + 0.5 + DC[e.dir] * e.prog) * T + e.ox,
    y: (e.r + 0.5 + DR[e.dir] * e.prog) * T + e.oy
  };
}

   ============================================================ */
// bias = tendencia a seguir reto quando "vaga"; speedMul = ritmo proprio de cada um
const GHOST_SPECS = [
  { name: "Laranja",  color: "#f97316", scatter: [1, 1], bias: 0.2, speedMul: 1.03 },
  { name: "Rosa",     color: "#ec4899", scatter: [1, COLS - 2], bias: 0.35, speedMul: 0.97 },
  { name: "Azul",     color: "#22d3ee", scatter: [ROWS - 2, COLS - 2], bias: 0.5, speedMul: 1.0 },
  { name: "Cachorro", color: "#a16207", scatter: [ROWS - 2, 1], bias: 0.65, speedMul: 1.06 }
];

function isTunnel(r, c){ return r === 10 && (c === 0 || c === COLS - 1); }

function buildLevel(){
  makeRecipe(level);
  maze = generateMaze();

  const grid = [];
  for (let r = 0; r < ROWS; r++) grid.push(new Array(COLS).fill(0));
  let total = 0;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++)
    if (maze[r][c] === OPEN && !isTunnel(r, c)){ grid[r][c] = 1; total++; }
  food = { grid, total, left: total };

  // pimenta nos 4 cantos (sem repetir tile)
  pepper = [];
  const corners = [[1, 1], [1, COLS - 2], [ROWS - 2, 1], [ROWS - 2, COLS - 2]];
  for (const [r, c] of corners){
    const t = nearestFoodTile(r, c);
    if (!t) continue;
    if (pepper.some(p => p.r === t[0] && p.c === t[1])) continue;
    pepper.push({ r: t[0], c: t[1] });
    if (grid[t[0]][t[1]]){ grid[t[0]][t[1]] = 0; food.left--; }
  }

  popups = []; feathers = [];
  levelTime = 0; hurry = false;
  frightTimer = 0; frightCombo = 0; turbo = 0; pelletEat = 0;
  chain = 0; chainT = 0; chainMult = 1; fruit = null; fruitSpawned = false;
  mode = "scatter"; modeTimer = 7;
  powerup = null; powerAt = clock + (bonus ? 4 : 6); magnetTimer = 0; magnetAcc = 0; slowTimer = 0; shield = 0;
  deathsThisLevel = 0;
  bossLevel = !bonus && level % 5 === 0;

  // boss secreto: um clone sombrio da galinha assada. Surge raramente, sem aviso.
  secretBoss = null; cloneAt = 0;
  if (!bonus && !bossLevel && level >= 2 && Math.random() < 0.06) cloneAt = clock + 8 + Math.random() * 24;

  const ps = nearestTileFrom(ROWS - 2, 1, "player");
  player = makeEntity(ps[0], ps[1], 0, playerSpeed(), "player");

  const base = ghostSpeed();
  ghosts = GHOST_SPECS.map((s, i) => {
    const g = makeEntity(GHOST_SPAWN[i][0], GHOST_SPAWN[i][1], 2, base, "ghostLeave");
    g.color = s.color; g.name = s.name; g.scatter = s.scatter;
    g.bias = s.bias; g.speedMul = s.speedMul;
    g.state = "leaving";
    g.active = !(i === 3 && level < 3);           // o cachorro entra na fase 3
    if (bossLevel && i === 3){                   // fase de chefe: o cachorro vira o chefe
      if (level % 10 === 0){ g.boss = true; g.master = true; g.hp = 5 + Math.floor(level / 5);
        g.name = "Mestre"; g.color = "#6d28d9"; }
      else { g.boss = true; g.hp = 3 + Math.floor(level / 5);
        g.name = "Chefe"; g.color = "#7c2d12"; }
      g.active = true;
    }
    g.releaseAt = clock + (i === 0 ? 0.4 : 2.5 + (i - 1) * 5) + (level - 1) * 0.5;
    return g;
  });

  fish = null;
  fishAt = clock + 1.0;
  const p = PAL[chapter().pal];
  C.bg = p.bg; C.wall = p.wall; C.wallEdge = p.wallEdge;
  trail = []; Sound.startMusic(level); buildMazeLayer();
}

// a curva nao satura: a pressao continua subindo ate a fase 30
function playerSpeed(){ return (7.4 + Math.min(level, 9) * 0.13 + Math.max(0, level - 9) * 0.06) * DIFF[CFG.diff].player; }
function ghostSpeed(){ return (4.9 + Math.min(level, 11) * 0.24 + Math.max(0, level - 11) * 0.10) * DIFF[CFG.diff].ghost * (bonus ? 0.55 : 1); }

// boss secreto: um clone corrompido da galinha assada. Reaproveita a IA/colisão dos chefes.
function spawnSecretBoss(){
  if (secretBoss || bonus) return;
  let best = null, bd = -1;
  const corners = [[1, COLS - 2], [1, 1], [ROWS - 2, 1], [ROWS - 2, COLS - 2]];
  for (const [r, c] of corners){
    const t = nearestTileFrom(r, c, "ghost");
    const d = (t[0] - player.r) * (t[0] - player.r) + (t[1] - player.c) * (t[1] - player.c);
    if (d > bd){ bd = d; best = t; }
  }
  const g = makeEntity(best[0], best[1], 2, ghostSpeed(), "ghost");
  g.color = "#4c1d95"; g.name = "Clone"; g.scatter = [best[0], best[1]];
  g.bias = 0.5; g.speedMul = 1.08;
  g.boss = true; g.clone = true; g.master = false; g.hp = 6;
  g.state = "chase"; g.active = true; g.releaseAt = clock;
  ghosts.push(g);
  secretBoss = g;
  shake = Math.max(shake, CFG.reduceMotion ? 0 : 0.5);
  Buzz.ok([80, 60, 120, 60, 200]);
  Sound.bossWarn();
  toast("GALINHA MIRROR! Um clone da galinha assada apareceu!", "#a855f7");
  popups.push({ r: g.r, c: g.c, text: "CLONE!", t: 0, color: "#c084fc" });
}

// peixe bonus: surge de tempos em tempos num corredor vazio
function updateFish(){
  if (clock < fishAt) return;
  fishAt = clock + (bonus ? 4 : 11);
  if (fish) return;
  const cand = [];
  for (let r = 1; r < ROWS - 1; r++) for (let c = 1; c < COLS - 1; c++)
    if (!food.grid[r][c] && maze[r][c] === OPEN) cand.push([r, c]);
  if (!cand.length) return;
  const p = cand[(Math.random() * cand.length) | 0];
  fish = { r: p[0], c: p[1], born: clock, at: fishAt };
}

// pimenta dourada: na fase bônus aparece o tempo todo; no jogo normal, uma vez por fase
const FRUITS = [
  { id: "gold",  name: "PIMENTA DOURADA", pts: 500,  turbo: 4.5, color: "#facc15" },
  { id: "heart", name: "CORAÇÃO",         pts: 0,    life: 1,   color: "#f472b6" },
  { id: "egg",   name: "OVO ASSADO",      pts: 750,  turbo: 3.5, color: "#fff1d6" },
  { id: "star",  name: "ESTRELA",         pts: 1000, turbo: 5,   color: "#93c5fd" }
];
function updateFruit(){
  if (fruitSpawned) return;
  if (!bonus && food.left > food.total * 0.5 && levelTime < 20) return;
  const cand = [];
  for (let r = 1; r < ROWS - 1; r++) for (let c = 1; c < COLS - 1; c++){
    if (maze[r][c] !== OPEN || isTunnel(r, c)) continue;
    if (food.grid[r][c]) continue;                   // prefere corredor vazio
    const d = Math.abs(r - player.r) + Math.abs(c - player.c);
    if (d < 5 || d > 16) continue;
    cand.push([r, c]);
  }
  if (!cand.length) return;
  fruitSpawned = true;
  const p = cand[(Math.random() * cand.length) | 0];
  fruit = { r: p[0], c: p[1], left: 11, type: FRUITS[(level - 1) % FRUITS.length] };
}

/* ---- power-ups: ímã de açaí, escudo, tempo lento, moeda e pimenta mágica ---- */
function updatePowerup(){
  if (clock < powerAt) return;
  powerAt = clock + (bonus ? 8 : 15);
  if (powerup || (!bonus && level < 2)) return;
  const cand = [];
  for (let r = 1; r < ROWS - 1; r++) for (let c = 1; c < COLS - 1; c++){
    if (maze[r][c] !== OPEN || isTunnel(r, c) || food.grid[r][c]) continue;
    if (fish && fish.r === r && fish.c === c) continue;
    if (fruit && fruit.r === r && fruit.c === c) continue;
    const d = Math.abs(r - player.r) + Math.abs(c - player.c);
    if (d < 4 || d > 15) continue;
    cand.push([r, c]);
  }
  if (!cand.length) return;
  const p = cand[(Math.random() * cand.length) | 0];
  const r = Math.random();
  const kinds = r < 0.26 ? "magnet" : r < 0.50 ? "shield" : r < 0.72 ? "slow" : r < 0.88 ? "coin" : "chili";
  powerup = { r: p[0], c: p[1], kind: kinds, born: clock, left: 12 };
}

function collectPowerup(kind){
  Buzz.ok([30, 40, 70]); shake = Math.max(shake, 0.3);
  if (kind === "magnet"){ Sound.powerup(); magnetTimer = 8; PROG.magnets++;
    popups.push({ r: player.r, c: player.c, text: "ÍMÃ DE AÇAÍ!", t: 0, color: "#c084fc" }); }
  else if (kind === "shield"){ Sound.powerup(); shield = Math.min(3, shield + 1);
    popups.push({ r: player.r, c: player.c, text: "ESCUDO +1", t: 0, color: "#60a5fa" }); }
  else if (kind === "slow"){ Sound.powerup(); slowTimer = 7; PROG.slows++;
    popups.push({ r: player.r, c: player.c, text: "TEMPO LENTO!", t: 0, color: "#2dd4bf" }); }
  else if (kind === "coin"){ Sound.coin(); addScore(200); PROG.coins++; mstBump("k");
    popups.push({ r: player.r, c: player.c, text: "+200 MOEDA", t: 0, color: "#fde047" }); }
  else if (kind === "chili"){ Sound.power(); frightTimer = Math.max(frightTimer, 8) * DIFF[CFG.diff].fright; turbo = Math.max(turbo, 5); frightCombo = 0; PROG.chilis++;
    popups.push({ r: player.r, c: player.c, text: "PIMENTA MÁGICA!", t: 0, color: "#f87171" }); }
  saveProg(); checkAch();
}

// come um açaí (usado pelo jogador e pelo ímã)
function eatPellet(pr, pc, quiet){
  if (!food.grid[pr][pc]) return false;
  food.grid[pr][pc] = 0;
  food.left--;
  alt = !alt; pelletEat++;
  if (!quiet){
    if (pelletEat % 4 === 0) Buzz.ok(9);
    Sound.waka(alt);
  }
  if (!CFG.reduceMotion){
    const n = quiet ? 2 : 4;
    for (let i = 0; i < n; i++){
      const a = Math.random() * Math.PI * 2;
      sparks.push({ x: (pc + 0.5) * T, y: (pr + 0.5) * T, vx: Math.cos(a) * 40, vy: Math.sin(a) * 40, t: 0, life: 0.22 });
    }
  }
  chainT = 1.2; chain++;
  chainMult = Math.min(5, 1 + Math.floor((chain - 1) / 5));
  if (chainMult > PROG.maxCombo) PROG.maxCombo = chainMult;
  addScore((bonus ? 20 : 10) * chainMult);
  recipeBump("pellet", 1);
  if (chainMult >= 3) recipeBump("combo", 1);
  if (chainMult > 1 && chain % 5 === 1)
    popups.push({ r: pr, c: pc, text: "COMBO x" + chainMult, t: 0, color: "#facc15" });
  if (food.left < Math.max(6, 24 - level) && !hurry){ hurry = true; if (state === "play") Sound.sirenHurry(); }
  if (firstRun && !tips.pellet && pelletEat === 8){
    tips.pellet = true;
    toast("Açaí +10 por açaí • limpe o labirinto para zerar a fase!", "#facc15");
  }
  return true;
}

function respawn(){
  const ps = nearestTileFrom(ROWS - 2, 1, "player");
  player = makeEntity(ps[0], ps[1], 0, playerSpeed(), "player");
  ghosts.forEach((g, i) => {
    const sp = GHOST_SPAWN[i];
    if (!sp){
      // gato extra (o clone secreto surge depois): fica onde esta,
      // so volta a cacar -- antes isso quebrava o jogo ao morrer
      g.prog = 0; g.ox = 0; g.oy = 0; g.blocked = true;
      g.who = "ghostLeave"; g.state = "leaving"; g.releaseAt = clock + 1;
      return;
    }
    g.r = sp[0]; g.c = sp[1]; g.dir = 2; g.want = 2; g.prog = 0; g.ox = 0; g.oy = 0;
    g.who = "ghostLeave"; g.state = "leaving"; g.blocked = true;
    g.baseSpeed = ghostSpeed();
    g.releaseAt = clock + (i === 0 ? 0.4 : 2.5 + (i - 1) * 5);
  });
  frightTimer = 0; frightCombo = 0; turbo = 0; mode = "scatter"; modeTimer = 7;
  magnetTimer = 0; slowTimer = 0; shield = 0;
  state = "ready"; stateTimer = 3.0; countBeep = 0;
  hideOverlay();
  saveRun();
}

function claimDaily(){
  const d = dayKey();
  if (lastDay === d) return { claimed: false, reason: "hoje" };
  if (lastDay && getDiffDays(lastDay, d) === 1){
    streak = Math.min(7, streak + 1);
  } else {
    streak = 1;
  }
  lastDay = d;
  store.set(DAY_KEY + "_streak", String(streak));
  store.set(DAY_KEY + "_last", lastDay);
  return { claimed: true, streak };
}
function getDiffDays(a, b){
  try {
    const da = new Date(a + "T00:00:00Z"), db = new Date(b + "T00:00:00Z");
    return Math.round((db - da) / (86400000));
  } catch (e) { return 999; }
}
const DAILY_REWARDS = [
  { name: "VIDA EXTRA", color: "#f59e0b", give: () => { lives++; refreshStats(); Sound.extra(); } },
  { name: "TURBO CURTO", color: "#22d3ee", give: () => { turbo = Math.max(turbo, 6); } },
  { name: "PONTOS +500", color: "#fde68a", give: () => { addScore(500); } },
  { name: "FRIGHT LONGO", color: "#93c5fd", give: () => { frightTimer = Math.max(frightTimer, 8); Sound.power(); } },
  { name: "PONTOS +1000", color: "#facc15", give: () => { addScore(1000); } },
  { name: "VIDAS +2", color: "#a3e635", give: () => { lives += 2; refreshStats(); Sound.extra(); } },
  { name: "SKIN DO GATO!", color: "#a16207", give: () => { CFG.skin = "cat"; saveCfg(); } }
];

function addScore(n){
  score += n;
  bumpBest();

  // entao sem isso a pontuacao so subiria para o ranking no fim de jogo
  if (score - ultimoUpload >= 10000){ ultimoUpload = score; uploadScore(true); }
  while (extraAt > 0 && score >= extraAt){
    extraAt += 2000;
    lives++;
    Sound.extra();
    refreshStats();
    popups.push({ r: player.r, c: player.c, text: "VIDA EXTRA!", t: 0, color: "#f59e0b" });
  }
  refreshScore();
  if (!ACH_UNLOCKED.score5k || !ACH_UNLOCKED.score20k) checkAch();
}

// personalidade de cada gato aperta a cada fase
function ghostTarget(g){
  if (g.boss) return [player.r, player.c];          // o chefe nunca descansa
  if (mode === "scatter") return g.scatter;
  const pr = player.r, pc = player.c;
  const pd = player.dir;
  const lv = level;
  switch (g.name){
    case "Laranja": {                                  // cacador: aponta para a FRENTE da galinha
      const ahead = Math.min(6, 2 + lv);
      return [pr + DR[pd] * ahead, pc + DC[pd] * ahead];
    }
    case "Rosa": {                                     // interceptor: de longe mira a frente, de perto vai de frente
      if (Math.abs(pr - g.r) + Math.abs(pc - g.c) <= 4) return [pr, pc];
      const d = Math.min(9, 3 + lv);
      return [pr + DR[pd] * d, pc + DC[pd] * d];
    }
    case "Azul": {                                     // emboscada: vetor da Laranja dobrado alem da galinha
      const b = ghosts[0] && ghosts[0].active ? ghosts[0] : false;
      const src = b ? [b.r, b.c] : [pr, pc];
      const k = 2 + Math.min(5, lv);
      const vr = pr + (pr - src[0]) * k, vc = pc + (pc - src[1]) * k;
      if (Math.abs(vr - pr) + Math.abs(vc - pc) < 2) return g.scatter;  // regra dos 2 tiles
      return [vr, vc];
    }
    default: {                                         // cachorro: imprevisivel — alterna estilos
      if (lv >= 5 && modeTimer < 4) return [pr, pc];   // fim da perseguicao: ataque direto
      if (Math.random() < 0.3) return [pr + DR[g.dir] * 2, pc + DC[g.dir] * 2];  // embosca a propria frente
      const m = ghosts[1];
      return [m.r, m.c];                               // copia a Rosa (finge de lerdo)
    }
  }
}

function scared(g){ return g.state === "chase" && frightTimer > 0; }

// caminha ate um tile-alvo pelo campo de distancia (BFS)
function setWantToGoal(g, t){
  const goal = nearestTileFrom(
    Math.max(0, Math.min(ROWS - 1, t[0])),
    Math.max(0, Math.min(COLS - 1, t[1])),
    g.who);
  const dist = distField(goal[0], goal[1]);
  let bestScore = Infinity, next = null;
  for (let d = 0; d < 4; d++){
    if (!canStep(g, g.r + DR[d], g.c + DC[d])) continue;
    const v = dist[(g.r + DR[d]) * COLS + (g.c + DC[d])];
    let sc = v;
    if (d === OPP[g.dir]) sc += 8;      // voltar so quando nao houver saida
    else if (d === g.dir) sc -= 0.4;   // segue reto quando ha empate
    else sc += 0.8;                     // custo p/ mudar de direcao (mais natural)
    if (sc < bestScore){ bestScore = sc; next = d; }
  }
  if (next !== null) g.want = next;
}

// foge de verdade: maximiza a distancia ate a galinha e evita a frente dela
function flee(g){
  const pr = player.r, pc = player.c, pd = player.dir;
  const predR = pr + DR[pd] * 3, predC = pc + DC[pd] * 3;
  let best = -1e9, bd = -1;
  for (let d = 0; d < 4; d++){
    if (!canStep(g, g.r + DR[d], g.c + DC[d])) continue;
    const nr = g.r + DR[d], nc = g.c + DC[d];
    const dist = (nr - pr) * (nr - pr) + (nc - pc) * (nc - pc);
    const antiPred = (nr - predR) * (nr - predR) + (nc - predC) * (nc - predC);
    const score = dist + antiPred * 0.7 + (d === g.dir ? 4 : 0) - (d === OPP[g.dir] ? 2 : 0);
    if (score > best){ best = score; bd = d; }
  }
  if (bd >= 0) g.want = bd;
}

// modo "vagar": descanso com personalidade (nunca para de andar, tende a seguir reto)
function wander(g){
  const opts = [];
  for (let d = 0; d < 4; d++) if (canStep(g, g.r + DR[d], g.c + DC[d])) opts.push(d);
  const noBack = opts.filter(d => d !== OPP[g.dir]);
  const list = noBack.length ? noBack : opts;
  if (!list.length) return;
  const bias = g.bias == null ? 0.5 : g.bias;
  if (Math.random() < bias && list.indexOf(g.dir) >= 0){ g.want = g.dir; return; }
  g.want = list[(Math.random() * list.length) | 0];
}

// chamada sempre que o gato esta no centro de um tile (pode virar)
function ghostDecide(g){
  if (g.state === "eaten" && maze[g.r][g.c] === HOUSE){ g.state = "leaving"; g.who = "ghostLeave"; }
  if (g.state === "leaving" && g.r === EXIT_TILE[0] && g.c === EXIT_TILE[1]){
    g.state = "chase"; g.who = "ghost";
  }
  if (g.state !== "chase"){                          // voltando ou saindo da casa: alvo fixo
    setWantToGoal(g, g.state === "eaten" ? HOUSE_CENTER : EXIT_TILE);
    return;
  }
  if (g.boss){ setWantToGoal(g, [player.r, player.c]); return; }
  if (scared(g)){ flee(g); return; }                 // assustado: foge com estrategia
  if (mode === "rand"){ wander(g); return; }         // fase media+: descanso com personalidade
  setWantToGoal(g, ghostTarget(g));                  // perseguicao / dispersao
}

function updateGhost(g, dt){
  if (!g.active) return;
  if (g.state === "leaving" && clock < g.releaseAt) return;

  const fr = scared(g);
  g.baseSpeed = ghostSpeed();
  let sp = g.baseSpeed;
  if (g.state === "eaten") sp *= 1.9;
  else if (fr) sp *= 0.5;
  if (g.boss) sp *= g.master ? 1.06 : 1.04;
  sp *= g.speedMul || 1;
  if (slowTimer > 0) sp *= 0.55;
  if (hurry) sp *= 1.15;
  g.speed = sp;
  g.who = (g.state === "leaving" || g.state === "eaten") ? "ghostLeave" : "ghost";

  advance(g, dt, ghostDecide);
}

function updateModes(dt){
  let flipped = false;
  modeTimer -= dt;
  if (modeTimer <= 0){
    // rodizio de modos: dispersar -> perseguir -> (da fase 3 em diante) vagar
    if (mode === "scatter"){ mode = "chase"; modeTimer = Math.max(7, 21 - level); }
    else if (mode === "chase"){
      mode = level >= 3 ? "rand" : "scatter";
      modeTimer = level >= 3 ? 2.5 + Math.random() * 3 : 5;
    }
    else { mode = "scatter"; modeTimer = 5; }
    flipped = true;
  }
  // reversao classica (pac-man): quando os modos trocam, os gatos dao meia-volta
  if (flipped && frightTimer <= 0){
    for (const g of ghosts){
      if (!g.active || g.boss || g.state !== "chase") continue;
      g.want = OPP[g.dir];
    }
  }
  if (frightTimer > 0){
    frightTimer -= dt;
    if (frightTimer <= 0){ frightTimer = 0; frightCombo = 0; }
  }
}

/* ============================================================
   10. UPDATE
   ============================================================ */
function die(){
  if (state === "dying" || state === "over" || state === "clear") return;  // nao morre duas vezes
  state = "dying"; stateTimer = isZen() ? 0.9 : 1.8;
  deathsThisLevel++;
  mstSync();
  if (firstRun && !tips.death){
    tips.death = true;
    toast(isZen()
      ? "No modo Zen você não perde vida! Aproveite pra conhecer o labirinto."
      : "Perdeu uma vida… pimenta e escudo ajudam a sobreviver!", isZen() ? "#facc15" : "#f59e0b");
  }
  shake = Math.max(shake, CFG.reduceMotion ? 0 : 0.4);
  Buzz.ok([60, 70, 160]);
  Sound.stopSiren(); Sound.stopMusic(); Sound.die();
  const p = entPos(player);
  const featherN = CFG.reduceMotion ? 3 : 12;
  for (let i = 0; i < featherN; i++){
    feathers.push({
      x: p.x + (Math.random() - 0.5) * 22,
      y: p.y + (Math.random() - 0.5) * 22,
      vx: (Math.random() - 0.5) * 180,
      vy: (Math.random() - 0.5) * 180 - 70,
      rot: Math.random() * 6, vr: (Math.random() - 0.5) * 14, t: 0
    });
  }
  popups.push({ r: player.r, c: player.c, text: isZen() ? "DE VOLTA!" : "OPS!", t: 0, color: isZen() ? "#facc15" : "#ef4444" });
}

function update(dt){
  tGlobal += dt;
  clock += dt;

  if (state === "ready"){
    stateTimer -= dt;
    const n = Math.min(3, Math.ceil(stateTimer - 0.2));
    if (n > 0 && n !== countBeep){ countBeep = n; Sound.tone(520, 0.1, "square", 0.05); Buzz.ok(12); }
    if (stateTimer <= 0){ state = "play"; hideOverlay(); Sound.startSiren(level); }
    return;
  }
  if (state === "dying"){
    stateTimer -= dt;
    if (stateTimer <= 0){
      if (!isZen()){
        lives--;
        refreshStats();
        if (lives <= 0){ gameOver(); return; }
      }
      respawn();
    }
    return;
  }
  if (state === "clear"){
    stateTimer -= dt;
    if (stateTimer <= 0){
      const cur = level;
      if (bonus){ endBonus(); }
      else if (cur >= MAX_LEVEL){ startCredits(); }
      else { level++; newLevel(false); }
    }
    return;
  }
  if (state !== "play") return;

  levelTime += dt;
  updateModes(dt);
  updateFish();
  updateFruit();
  updatePowerup();
  if (fruit){
    fruit.left -= dt;
    if (fruit.left <= 0){ fruit = null; if (bonus) fruitSpawned = false; }
  }
  if (powerup){
    powerup.left -= dt;
    if (powerup.left <= 0) powerup = null;
  }

  for (const g of ghosts) updateGhost(g, dt);

  if (!bonus && cloneAt && !secretBoss && clock >= cloneAt) spawnSecretBoss();

  const pr = player.r, pc = player.c;

  // açaí
  if (food.grid[pr][pc]){
    eatPellet(pr, pc);
    if (food.left === 0){ levelClear(); return; }
  }

  // ímã de açaí: puxa os açaís perto da galinha
  if (magnetTimer > 0){
    magnetTimer = Math.max(0, magnetTimer - dt);
    magnetAcc += dt;
    if (magnetAcc >= 0.12){
      magnetAcc = 0;
      let got = 0;
      for (let r = pr - 3; r <= pr + 3 && got < 14; r++) for (let c = pc - 3; c <= pc + 3 && got < 14; c++){
        if (r < 0 || r >= ROWS || c < 0 || c >= COLS) continue;
        if (!food.grid[r][c]) continue;
        if (Math.abs(r - pr) + Math.abs(c - pc) > 3) continue;
        eatPellet(r, c, true); got++;
      }
      if (got && food.left === 0){ levelClear(); return; }
    }
  }
  if (slowTimer > 0) slowTimer = Math.max(0, slowTimer - dt);

  // pimenta
  if (pepper){
    for (let i = 0; i < pepper.length; i++){
      const p = pepper[i];
      if (!p || p.r !== pr || p.c !== pc) continue;
      pepper[i] = null;
      frightTimer = Math.max(2.2, 9 - level * 0.45) * DIFF[CFG.diff].fright;
      frightCombo = 0;
      turbo = 5.2;
      Buzz.ok(45);
      addScore(50);
      Sound.power();
      popups.push({ r: pr, c: pc, text: "PIMENTA! TURBO!", t: 0, color: "#ef4444" });
      if (firstRun && !tips.pepper){
        tips.pepper = true;
        toast("PIMENTA! Os gatos ficam azuis e comíveis — aproveite!", "#ef4444");
      }
    }
    if (pepper.every(p => !p)) pepper = null;
  }

  // fruta bônus (uma vez por fase; no bônus aparece o tempo todo)
  if (fruit && fruit.r === pr && fruit.c === pc){
    const F = fruit.type || FRUITS[0];
    if (F.life){
      lives++;
      refreshStats();
      Sound.extra();
      popups.push({ r: pr, c: pc, text: "CORAÇÃO! +1 VIDA", t: 0, color: F.color });
    } else {
      if (F.pts) addScore(F.pts);
      if (F.turbo) turbo = Math.max(turbo, F.turbo);
      popups.push({ r: pr, c: pc, text: F.name + (F.pts ? " +" + F.pts : ""), t: 0, color: F.color });
    }
    Buzz.ok([35, 40, 70]);
    Sound.eatFruit();
    PROG.fruits = (PROG.fruits || 0) + 1;
    saveProg();
    if (firstRun && !tips.fruit){ tips.fruit = true; toast("Fruta bônus dá pontos extras — ou uma vida!", "#facc15"); }
    fruit = null;
  }

  // peixe (fica ~11s no mapa)
  if (fish && fish.r === pr && fish.c === pc){
    addScore(100);
    PROG.fish++;
    recipeBump("fish", 1);
    mstBump("f");
    Buzz.ok(26);
    Sound.eatFish();
    popups.push({ r: pr, c: pc, text: "+100 PEIXE", t: 0, color: "#38bdf8" });
    if (firstRun && !tips.fish){
      tips.fish = true;
      toast("Peixe bônus vale +100 e some em segundos!", "#38bdf8");
    }
    fish = null;
    saveProg(); checkAch();
  }

  // power-up no mapa
  if (powerup && powerup.r === pr && powerup.c === pc){
    collectPowerup(powerup.kind);
    powerup = null;
  }

  // colisões
  const pp = entPos(player);
  for (const g of ghosts){
    if (!g.active || g.state === "eaten" || g.state === "leaving") continue;
    const gp = entPos(g);
    const dx = gp.x - pp.x, dy = gp.y - pp.y;
    const hitR = g.boss ? T * 0.72 : T * 0.55;
    if (dx * dx + dy * dy > hitR * hitR) continue;
    if (frightTimer > 0){
      if (g.boss && g.hp > 1){
        g.hp--;
        addScore(100);
        g.state = "eaten"; g.who = "ghostLeave";
        Buzz.ok(50); Sound.eatGhost();
        popups.push({ r: g.r, c: g.c, text: (g.clone ? "CLONE x" : "CHEFE x") + g.hp, t: 0, color: "#fca5a5" });
      } else {
        const val = g.clone ? 2500 : (g.boss ? 1000 : 200 * Math.pow(2, frightCombo));
        frightCombo = Math.min(3, frightCombo + 1);
        recipeBump("ghost", 1);
        addScore(val);
        g.state = "eaten"; g.who = "ghostLeave";
        Buzz.ok(g.boss ? 90 : 60);
        Sound.eatGhost();
        popups.push({ r: g.r, c: g.c, text: "+" + val, t: 0, color: "#a3e635" });
        PROG.ghosts++;
        mstBump("g");
        if (firstRun && !tips.ghost){
          tips.ghost = true;
          toast("Gato comido! +200 — coma mais enquanto estiverem azuis!", "#a3e635");
        }
        if (frightCombo > PROG.bestFrightCombo) PROG.bestFrightCombo = frightCombo;
        if (g.boss){
          g.boss = false; g.hp = 0;
          PROG.bossKills++;
          if (g.master) PROG.masters++;
          if (g.clone){ PROG.clones = (PROG.clones || 0) + 1; secretBoss = null; }
          else recipeBump("boss", 1);
          shake = Math.max(shake, CFG.reduceMotion ? 0 : 0.6);
          popups.push({ r: g.r, c: g.c, text: g.clone ? "CLONE DERROTADO!" : (g.master ? "MESTRE DERROTADO!" : "CHEFE DERROTADO!"), t: 0, color: g.clone ? "#c084fc" : "#f59e0b" });
          toast(g.clone ? "O clone da galinha foi frito! Espelho quebrado." : (g.master ? "Mestre derrotado!" : "Chefe derrotado!"), g.clone ? "#a855f7" : "#f59e0b");
        }
        saveProg(); checkAch();
      }
    } else if (shield > 0){
      shield--; PROG.shields++;
      g.state = "eaten"; g.who = "ghostLeave";
      shake = Math.max(shake, CFG.reduceMotion ? 0 : 0.35);
      Buzz.ok([20, 30, 60]); Sound.eatGhost();
      popups.push({ r: player.r, c: player.c, text: "ESCUDO!", t: 0, color: "#60a5fa" });
      saveProg(); checkAch();
    } else {
      die();
      return;
    }
  }

  if (chainT > 0){
    chainT -= dt;
    if (chainT <= 0){ chain = 0; chainMult = 1; }
  }
  if (turbo > 0) turbo = Math.max(0, turbo - dt);
  player.speed = player.baseSpeed * (turbo > 0 ? 1.25 : 1) * (frightTimer > 0 ? 1.08 : 1);

  for (let i = popups.length - 1; i >= 0; i--){
    popups[i].t += dt;
    if (popups[i].t > 1.2) popups.splice(i, 1);
  }
  for (let i = feathers.length - 1; i >= 0; i--){
    const f = feathers[i];
    f.t += dt; f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 430 * dt; f.rot += f.vr * dt;
    if (f.t > 1.5) feathers.splice(i, 1);
  }
  if (turbo > 0 && player.moving && !CFG.reduceMotion && Math.random() < 0.4){
    const pp = entPos(player);
    trail.push({ x: pp.x, y: pp.y, t: 0, life: 0.24 });
  }
  for (let i = trail.length - 1; i >= 0; i--){
    trail[i].t += dt;
    if (trail[i].t > trail[i].life) trail.splice(i, 1);
  }
  for (let i = sparks.length - 1; i >= 0; i--){
    const sp = sparks[i];
    sp.t += dt; sp.x += sp.vx * dt; sp.y += sp.vy * dt;
    sp.vx *= 0.96; sp.vy *= 0.96;
    if (sp.t > sp.life) sparks.splice(i, 1);
  }
  if (shake > 0) shake = Math.max(0, shake - dt);

  advance(player, dt);
}

/* ============================================================
   11. DESENHO
   ============================================================ */
function drawChickenBody(g, rot, R, wobble, pal){
  pal = pal || {};
  const co = {
    bone:     pal.bone     || "#fff6e0",
    g0:       pal.g0       || "#ffeeb0",
    g1:       pal.g1       || "#f59e0b",
    g2:       pal.g2       || "#b45309",
    line:     pal.line     || "#5b2d06",
    wing:     pal.wing     || "rgba(180,83,9,.5)",
    wingEdge: pal.wingEdge || "rgba(91,45,6,.55)",
    grill:    pal.grill    || "rgba(120,53,15,.4)",
    shine:    pal.shine    || "rgba(255,255,255,.32)",
    beak:     pal.beak     || "#ff8c00",
    beakEdge: pal.beakEdge || "#b45309",
    eye:      pal.eye      || "#fff",
    pupil:    pal.pupil    || "#1c1006"
  };
  g.save();
  g.rotate(rot);
  g.scale(1 + wobble * 0.08, 1 - wobble * 0.06);

  // coxinha atras
  g.save();
  g.translate(-R * 0.72, 0);
  g.rotate(-0.32);
  g.fillStyle = co.bone;
  g.fillRect(-2.5, -6, 5, 13);
  g.beginPath(); g.arc(-1.8, -7.5, 3.3, 0, 7); g.arc(1.8, -7.5, 3.3, 0, 7); g.fill();
  g.restore();

  // corpo assado
  const grd = g.createRadialGradient(-R * 0.3, -R * 0.35, R * 0.12, 0, 0, R * 1.12);
  grd.addColorStop(0, co.g0);
  grd.addColorStop(0.45, co.g1);
  grd.addColorStop(1, co.g2);
  g.beginPath(); g.arc(0, 0, R, 0, Math.PI * 2); g.fill();
  g.lineWidth = 2; g.strokeStyle = co.line; g.stroke();

  // asa
  g.beginPath();
  g.ellipse(-R * 0.12, R * 0.2, R * 0.6, R * 0.36, -0.35, 0, Math.PI * 2);
  g.fillStyle = co.wing; g.fill();
  g.strokeStyle = co.wingEdge; g.lineWidth = 1.4; g.stroke();

  // marcas de grelha
  g.strokeStyle = co.grill; g.lineWidth = 1.6;
  for (let i = -1; i <= 1; i++){
    g.beginPath();
    g.arc(0, i * R * 0.3, R * 0.85, -0.85 + i * 0.35, 0.85 + i * 0.35);
    g.stroke();
  }

  // brilho
  g.beginPath();
  g.ellipse(-R * 0.34, -R * 0.44, R * 0.27, R * 0.15, -0.6, 0, Math.PI * 2);
  g.fillStyle = co.shine; g.fill();

  // bico
  g.beginPath();
  g.moveTo(R * 0.7, -R * 0.18);
  g.lineTo(R * 1.36, R * 0.06);
  g.lineTo(R * 0.7, R * 0.3);
  g.closePath();
  g.fillStyle = co.beak; g.fill();
  g.strokeStyle = co.beakEdge; g.lineWidth = 1.3; g.stroke();

  // olho
  g.beginPath(); g.arc(R * 0.3, -R * 0.38, R * 0.24, 0, Math.PI * 2);
  g.fillStyle = co.eye; g.fill();
  g.beginPath(); g.arc(R * 0.36, -R * 0.36, R * 0.12, 0, Math.PI * 2);
  g.fillStyle = co.pupil; g.fill();

  g.restore();
}

function drawChicken(x, y, rot, R, opts){
  opts = opts || {};
  if (opts.aura){
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(tGlobal * 5);
    ctx.globalAlpha = 0.5 + Math.sin(tGlobal * 12) * 0.2;
    const grd = ctx.createRadialGradient(0, 0, R * 0.5, 0, 0, R * 2.2);
    if (opts.fire){
      grd.addColorStop(0, "rgba(255,255,255,.95)");
      grd.addColorStop(0.4, "rgba(251,146,60,.6)");
      grd.addColorStop(1, "rgba(239,68,68,0)");
    } else {
      grd.addColorStop(0, "rgba(255,214,102,.9)");
      grd.addColorStop(0.5, "rgba(249,115,22,.45)");
      grd.addColorStop(1, "rgba(239,68,68,0)");
    }
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(0, 0, R * 2.2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  ctx.save();
  ctx.translate(x, y);
  ctx.beginPath(); ctx.ellipse(0, R * 0.58, R * 0.85, R * 0.3, 0, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(0,0,0,.32)"; ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(x, y);
  drawChickenBody(ctx, rot, R, opts.wobble || 0);
  ctx.restore();
}

// boss secreto: o clone corrompido da galinha assada (mesma silhueta, cores sombrias + aura)
const CLONE_PAL = {
  bone: "#cbd5e1", g0: "#94a3b8", g1: "#475569", g2: "#1e293b",
  line: "#0f172a", wing: "rgba(30,41,59,.68)", wingEdge: "rgba(2,6,23,.65)",
  grill: "rgba(0,0,0,.5)", shine: "rgba(255,255,255,.16)",
  beak: "#dc2626", beakEdge: "#7f1d1d", eye: "#fee2e2", pupil: "#b91c1c"
};

function drawClone(x, y, rot, R, g){
  const eaten = g && g.state === "eaten";
  const fr = scared(g);

  // aura sombria
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(tGlobal * 3);
  ctx.globalAlpha = 0.4 + Math.sin(tGlobal * 10) * 0.18;
  const aura = ctx.createRadialGradient(0, 0, R * 0.4, 0, 0, R * 2.3);
  aura.addColorStop(0, "rgba(168,85,247,.85)");
  aura.addColorStop(0.5, "rgba(88,28,135,.5)");
  aura.addColorStop(1, "rgba(24,0,40,0)");
  ctx.fillStyle = aura;
  ctx.beginPath(); ctx.arc(0, 0, R * 2.3, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(x, y);
  ctx.beginPath(); ctx.ellipse(0, R * 0.58, R * 0.85, R * 0.3, 0, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(0,0,0,.4)"; ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(x, y);
  drawChickenBody(ctx, rot, R, eaten ? 0 : Math.sin(tGlobal * 14) * 0.05,
    fr ? { beak: "#3b82f6", beakEdge: "#1e3a8a", g1: "#3b82f6", g2: "#1d4ed8", line: "#0b1e5a", eye: "#fff", pupil: "#0b1e5a" } : CLONE_PAL);
  ctx.restore();

  // brilho vermelho no olho
  if (!eaten && !fr){
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.shadowColor = "rgba(239,68,68,.95)"; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(R * 0.36, -R * 0.36, R * 0.14, 0, Math.PI * 2);
    ctx.fillStyle = "#ef4444"; ctx.fill();
    ctx.restore();
  }

  // pips de vida do chefe
  if (g && g.boss && !eaten){
    ctx.save();
    ctx.translate(x, y);
    for (let i = 0; i < g.hp; i++){
      ctx.beginPath();
      ctx.arc((i - (g.hp - 1) / 2) * R * 0.4, R * 1.15, R * 0.13, 0, Math.PI * 2);
      ctx.fillStyle = "#fca5a5"; ctx.fill();
    }
    ctx.restore();
  }
}

// corpo do gato (orelhas + corpo com gradiente) desenhado 1x num sprite offscreen
// e reaproveitado com drawImage: evita recriar gradiente e caminhos a cada frame.
const GHOST_SPRITES = new Map();
function ghostBodySprite(body, edge, R){
  const key = body + "|" + edge + "|" + R;
  let spr = GHOST_SPRITES.get(key);
  if (spr) return spr;
  const SS = 2, pad = 4;
  const logical = 2.8 * R + pad * 2;
  const px = Math.ceil(logical * SS);
  const c = document.createElement("canvas");
  c.width = px; c.height = px;
  const g = c.getContext("2d");
  g.setTransform(SS, 0, 0, SS, 0, 0);
  g.translate(logical / 2, logical / 2);

  // orelhas
  g.beginPath();
  g.moveTo(-R * 0.9, -R * 0.5); g.lineTo(-R * 0.58, -R * 1.3); g.lineTo(-R * 0.22, -R * 0.7);
  g.closePath();
  g.moveTo(R * 0.9, -R * 0.5); g.lineTo(R * 0.58, -R * 1.3); g.lineTo(R * 0.22, -R * 0.7);
  g.closePath();
  g.fillStyle = body; g.fill();
  g.strokeStyle = edge; g.lineWidth = 1.6; g.stroke();

  // corpo
  g.beginPath();
  g.arc(0, -R * 0.12, R, Math.PI, Math.PI * 2);
  g.lineTo(R, R * 0.5);
  const waves = 3, stepW = 2 * R / waves;
  for (let i = 0; i < waves; i++){
    const x0 = R - stepW * i, x1 = R - stepW * (i + 1);
    g.quadraticCurveTo((x0 + x1) / 2, R * (i % 2 ? 1.1 : 0.4), x1, R * 0.5);
  }
  g.closePath();
  const grd = g.createLinearGradient(0, -R, 0, R);
  grd.addColorStop(0, "rgba(255,255,255,.35)");
  grd.addColorStop(0.35, body);
  grd.addColorStop(1, "rgba(0,0,0,.35)");
  g.fillStyle = grd; g.fill();
  g.strokeStyle = edge; g.lineWidth = 2; g.stroke();

  spr = { canvas: c, logical };
  GHOST_SPRITES.set(key, spr);
  return spr;
}

function drawGhost(x, y, g, R){
  const eaten = g.state === "eaten";
  const fr = scared(g);
  const look = DC[g.dir];
  ctx.save();
  ctx.translate(x, y);

  if (!eaten){
    let body = g.color, edge = "rgba(0,0,0,.5)";
    if (fr){ body = (Math.floor(tGlobal * 6) % 2) ? "#3b82f6" : "#1d4ed8"; edge = "#0b1e5a"; }

    ctx.beginPath(); ctx.ellipse(0, R * 0.72, R * 0.8, R * 0.26, 0, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0,0,0,.3)"; ctx.fill();

    // orelhas + corpo (sprite em cache)
    const spr = ghostBodySprite(body, edge, R);
    ctx.drawImage(spr.canvas, -spr.logical / 2, -spr.logical / 2, spr.logical, spr.logical);

    if (fr){
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(-R * 0.36, -R * 0.12, R * 0.17, 0, Math.PI * 2);
      ctx.arc(R * 0.36, -R * 0.12, R * 0.17, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i <= 6; i++){
        const x = -R * 0.7 + (R * 1.4 / 6) * i;
        const y = R * 0.28 + (i % 2 ? R * 0.18 : -R * 0.18);
        if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
      }
      ctx.stroke();
    } else {
      for (const sx of [-1, 1]){
        ctx.beginPath();
        ctx.ellipse(sx * R * 0.38, -R * 0.2, R * 0.25, R * 0.31, 0, 0, Math.PI * 2);
        ctx.fillStyle = "#fff"; ctx.fill();
        ctx.beginPath();
        ctx.arc(sx * R * 0.38 + look * R * 0.12, -R * 0.14, R * 0.13, 0, Math.PI * 2);
        ctx.fillStyle = "#0f172a"; ctx.fill();
      }
      ctx.beginPath();
      ctx.moveTo(0, R * 0.04); ctx.lineTo(-R * 0.13, R * 0.22); ctx.lineTo(R * 0.13, R * 0.22);
      ctx.closePath(); ctx.fillStyle = "#fda4af"; ctx.fill();
    }
  } else {
    for (const sx of [-1, 1]){
      ctx.beginPath();
      ctx.ellipse(sx * R * 0.38, -R * 0.12, R * 0.24, R * 0.3, 0, 0, Math.PI * 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.beginPath();
      ctx.arc(sx * R * 0.38 + look * R * 0.12, -R * 0.07, R * 0.13, 0, Math.PI * 2);
      ctx.fillStyle = "#1e3a8a"; ctx.fill();
    }
  }
  if (g.boss && !eaten){
    ctx.beginPath();
    ctx.moveTo(-R * 0.7, -R * 1.25);
    ctx.lineTo(-R * 0.55, -R * 1.78);
    ctx.lineTo(-R * 0.2, -R * 1.42);
    ctx.lineTo(0, -R * 1.9);
    ctx.lineTo(R * 0.2, -R * 1.42);
    ctx.lineTo(R * 0.55, -R * 1.78);
    ctx.lineTo(R * 0.7, -R * 1.25);
    ctx.closePath();
    ctx.fillStyle = "#facc15"; ctx.fill();
    ctx.strokeStyle = "#a16207"; ctx.lineWidth = 1.2; ctx.stroke();
    for (let i = 0; i < g.hp; i++){
      ctx.beginPath();
      ctx.arc((i - (g.hp - 1) / 2) * R * 0.4, R * 1.05, R * 0.13, 0, Math.PI * 2);
      ctx.fillStyle = "#fca5a5"; ctx.fill();
    }
  }
  ctx.restore();
}

let mazeLayer = null;

// desenha o labirinto inteiro uma vez em um canvas fora da tela
function buildMazeLayer(){
  try {
    const off = document.createElement("canvas");
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    off.width = Math.round(W * dpr);
    off.height = Math.round(H * dpr);
    const g = off.getContext("2d");
    if (!g) return;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawMaze(g);
    mazeLayer = off;
  } catch (e) { mazeLayer = null; }
}

function renderMaze(){
  if (!mazeLayer){ drawMaze(ctx); return; }
  ctx.drawImage(mazeLayer, 0, 0, W, H);
  // piscada de fim de fase: so as paredes mudam de cor (barato)
  if (state === "clear" && Math.floor(tGlobal * 8) % 2 === 0){
    ctx.fillStyle = "#fde68a";
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++)
      if (maze[r][c] === WALL) ctx.fillRect(c * T, r * T, T, T);
  }
}

function drawMaze(g){
  const flash = false;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++){
    const t = maze[r][c];
    if (t === WALL){
      g.fillStyle = flash ? "#fde68a" : C.wall;
      g.fillRect(c * T, r * T, T, T);
    } else if (t === DOOR){
      g.fillStyle = "#f9a8d4";
      g.fillRect(c * T + 5, r * T + T / 2 - 2, T - 10, 4);
    } else if (t === HOUSE){
      g.strokeStyle = "rgba(236,72,153,.3)";
      g.lineWidth = 2;
      g.strokeRect(c * T + 1.5, r * T + 1.5, T - 3, T - 3);
    } else if (isTunnel(r, c)){
      g.fillStyle = "#04010a";
      g.fillRect(c * T, r * T, T, T);
      g.strokeStyle = "rgba(192,38,211,.55)"; g.lineWidth = 2;
      const bx = c === 0 ? T - 2 : 2;
      g.beginPath();
      g.moveTo(bx, r * T + 4); g.lineTo(bx, r * T + T - 4);
      g.stroke();
    }
  }
  g.lineCap = "round";
  g.lineWidth = 6;
  g.strokeStyle = C.wallEdge;
  g.globalAlpha = 0.5;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++){
    if (maze[r][c] !== WALL) continue;
    const x = c * T, y = r * T;
    const up = r === 0 || maze[r - 1][c] !== WALL;
    const dn = r === ROWS - 1 || maze[r + 1][c] !== WALL;
    const lf = c === 0 || maze[r][c - 1] !== WALL;
    const rt = c === COLS - 1 || maze[r][c + 1] !== WALL;
    if (up){ g.beginPath(); g.moveTo(x, y + 3); g.lineTo(x + T, y + 3); g.stroke(); }
    if (dn){ g.beginPath(); g.moveTo(x, y + T - 3); g.lineTo(x + T, y + T - 3); g.stroke(); }
    if (lf){ g.beginPath(); g.moveTo(x + 3, y); g.lineTo(x + 3, y + T); g.stroke(); }
    if (rt){ g.beginPath(); g.moveTo(x + T - 3, y); g.lineTo(x + T - 3, y + T); g.stroke(); }
  }
  g.globalAlpha = 1;
}
