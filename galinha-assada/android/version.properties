# Versão do Galinha Assada usada pelo CI e por publicações locais.
#
# O `build.sh` usa minutos desde 1970 quando nada é informado, o que fazia cada
# publicação gerar um versionCode novo (e o metadata nunca bater com o repo).
# Aqui a versão é explícita e determinística:
#
#   • mude o jogo  → suba o versionCode (sempre maior que o anterior)
#   • mesmo código → mesma versão, publicação repetida não gera versão nova
#
# `scripts/verificar-fdroid.py` compara o publicado com estes valores.
versionCode=29883107
versionName=1.26.10.26
